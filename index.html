<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ideal Home & Weddings | Premium Amazon Essentials 2026</title>
    
    <!-- ADSENSE AUTH -->
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-5280872495839888" crossorigin="anonymous"></script>

    <!-- SEO ESTRATÉGICO -->
    <meta name="description" content="Handpicked Amazon registry essentials for modern homes. Shop top-rated decor and kitchen gadgets in USA. Guía experta bilingüe.">
    <link rel="canonical" href="https://ideal-home-weddings-production.up.railway.app/" />
    
    <style>
        :root { 
            --gold: #b59410; 
            --dark: #121212; 
            --border: #F0F0F0; 
            --accent: #ff4500; 
        }
        
        * { 
            box-sizing: border-box; 
            margin: 0; 
            padding: 0; 
        }
        
        body { 
            font-family: 'Helvetica Neue', Arial, sans-serif; 
            background: #fff; 
            color: var(--dark); 
            line-height: 1.6; 
        }
        
        .container { 
            max-width: 1200px; 
            margin: 0 auto; 
            padding: 0 20px; 
        }

        .mxl-lang-bar { 
            background: var(--dark); 
            padding: 10px 0; 
            text-align: right; 
            border-bottom: 2px solid var(--gold); 
            position: sticky; 
            top: 0; 
            z-index: 2000; 
        }
        
        .lang-btn { 
            background: none; 
            border: 1px solid #444; 
            color: #fff; 
            font-size: 11px; 
            padding: 5px 15px; 
            cursor: pointer; 
            text-transform: uppercase; 
            border-radius: 3px; 
            margin-left: 10px; 
            font-weight: bold; 
        }
        
        .lang-btn.active { 
            border-color: var(--gold); 
            color: var(--gold); 
        }

        header { 
            padding: 50px 0; 
            text-align: center; 
            background: #fcfcfc; 
            border-bottom: 1px solid var(--border); 
        }
        
        header h1 { 
            font-weight: 300; 
            letter-spacing: 4px; 
            text-transform: uppercase; 
            font-size: 26px; 
        }
        
        header h1 span { 
            color: var(--gold); 
            font-weight: bold; 
        }

        .main-content { 
            display: grid; 
            grid-template-columns: 1fr 320px; 
            gap: 40px; 
            margin-top: 40px; 
        }
        
        .product-grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); 
            gap: 30px; 
        }
        
        .product-card { 
            border: 1px solid var(--border); 
            padding: 25px; 
            text-align: center; 
            transition: 0.3s; 
            position: relative; 
            border-radius: 12px; 
            background: #fff; 
        }
        
        .product-card:hover { 
            transform: translateY(-5px); 
            box-shadow: 0 15px 35px rgba(0,0,0,0.08); 
            border-color: var(--gold); 
        }
        
        .product-card img { 
            width: 100%; 
            height: 250px; 
            object-fit: contain; 
            margin-bottom: 15px; 
        }
        
        .btn-amazon { 
            display: block; 
            background: var(--dark); 
            color: #fff; 
            padding: 15px; 
            font-size: 11px; 
            font-weight: bold; 
            text-transform: uppercase; 
            text-decoration: none; 
            margin-top: 15px; 
            border-radius: 6px; 
        }
        
        .btn-amazon:hover { 
            background: var(--gold); 
        }

        aside { 
            border-left: 1px solid var(--border); 
            padding-left: 25px; 
        }
        
        footer { 
            background: var(--dark); 
            color: #fff; 
            padding: 60px 0; 
            text-align: center; 
            font-size: 11px; 
            margin-top: 80px; 
        }
        
        #sale-popup { 
            position: fixed; 
            bottom: 20px; 
            left: 20px; 
            background: #fff; 
            border: 1px solid var(--border); 
            padding: 12px; 
            border-radius: 8px; 
            box-shadow: 0 5px 20px rgba(0,0,0,0.1); 
            display: flex; 
            align-items: center; 
            gap: 10px;
        }
        
        @media (max-width: 768px) {
            .main-content {
                grid-template-columns: 1fr;
            }
            aside {
                border-left: none;
                padding-left: 0;
                margin-top: 40px;
            }
        }
    </style>
</head>
<body>
    <div class="mxl-lang-bar">
        <div class="container">
            <button class="lang-btn active" onclick="setLanguage('en')">EN</button>
            <button class="lang-btn" onclick="setLanguage('es')">ES</button>
        </div>
    </div>

    <header>
        <div class="container">
            <h1>Ideal Home & <span>Weddings</span></h1>
            <p style="margin-top: 15px; color: #666;">Premium Amazon Essentials for Your New Life Together</p>
        </div>
    </header>

    <div class="container">
        <div class="main-content">
            <main>
                <div class="product-grid" id="product-grid">
                    <!-- Productos cargados dinámicamente -->
                </div>
            </main>
            <aside>
                <h3>✨ Wedding Registry Tips</h3>
                <ul style="margin-top: 20px; list-style: none;">
                    <li>🎁 Top 10 Kitchen Essentials</li>
                    <li>🏠 Smart Home Must-Haves</li>
                    <li>💎 Luxury Under $100</li>
                </ul>
            </aside>
        </div>
    </div>

    <footer>
        <div class="container">
            <p>© 2026 Ideal Home & Weddings. As an Amazon Associate we earn from qualifying purchases.</p>
        </div>
    </footer>

    <div id="sale-popup" style="display: none;">
        <span>🎉</span>
        <span>Limited Time Offer!</span>
    </div>

    <script>
        function setLanguage(lang) {
            const buttons = document.querySelectorAll('.lang-btn');
            buttons.forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            console.log('Language set to:', lang);
            // Aquí puedes agregar lógica de traducción
        }

        // Cargar productos desde el backend
        async function loadProducts() {
            try {
                const response = await fetch('/api/productos');
                const products = await response.json();
                const grid = document.getElementById('product-grid');
                
                if (products.length === 0) {
                    grid.innerHTML = '<p style="text-align: center;">Loading products...</p>';
                    return;
                }
                
                grid.innerHTML = products.map(product => `
                    <div class="product-card">
                        <img src="${product.image || 'https://via.placeholder.com/250'}" alt="${product.title}">
                        <h3>${product.title}</h3>
                        <p>${product.price || 'Check price on Amazon'}</p>
                        <a href="${product.link || '#'}" class="btn-amazon" target="_blank">View on Amazon →</a>
                    </div>
                `).join('');
            } catch (error) {
                console.error('Error loading products:', error);
            }
        }

        loadProducts();
    </script>
</body>
</html>
