<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MXL GOLD MINER | Luxury Home Trends USA 2026</title>
    <meta name="description" content="Descubre las curiosidades más virales sobre lujo y estilo de vida en USA. Productos exclusivos para mujeres de alto poder adquisitivo en Manhattan, Miami y Beverly Hills.">
    <meta name="keywords" content="luxury home, smart home, status symbol, NYC, Miami, Beverly Hills, zero-waste, elite living">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=DM+Sans:wght@300;400;500;600&display=swap');

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'DM Sans', sans-serif;
            background: #fffaf7;
            color: #2c2418;
            line-height: 1.6;
        }

        /* ── HEADER PREMIUM ── */
        .viral-header {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: white;
            padding: 80px 20px;
            text-align: center;
            position: relative;
            overflow: hidden;
        }
        .viral-header h1 {
            font-family: 'Playfair Display', serif;
            font-size: 3rem;
            font-weight: 700;
            margin-bottom: 15px;
        }
        .viral-header h1 span {
            background: linear-gradient(135deg, #ff4500, #ff6b35);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .live-badge {
            display: inline-block;
            background: #ff4500;
            color: white;
            padding: 6px 18px;
            border-radius: 40px;
            font-size: 12px;
            margin-top: 25px;
            animation: pulse 1.5s infinite;
            font-weight: bold;
        }
        @keyframes pulse {
            0%,100% { opacity: .7; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.05); }
        }

        .container { max-width: 1300px; margin: 0 auto; padding: 60px 20px; }

        .section-title {
            font-family: 'Playfair Display', serif;
            font-size: 1.9rem;
            margin-bottom: 40px;
            text-align: center;
            color: #2c2418;
        }
        .section-title:after {
            content: ''; display: block; width: 60px; height: 3px; background: #c9a87b; margin: 14px auto 0;
        }

        /* ── GRID DE PRODUCTOS ── */
        .productos-grid, .curiosidades-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 28px;
        }

        .card {
            background: white; border-radius: 20px; overflow: hidden;
            box-shadow: 0 6px 24px rgba(0,0,0,.07); border: 1px solid #f0e2d8;
            transition: all .3s; cursor: pointer;
        }
        .card:hover { transform: translateY(-6px); box-shadow: 0 16px 36px rgba(0,0,0,.13); }

        .card-img { width: 100%; height: 250px; overflow: hidden; background: #faf7f3; }
        .card-img img { width: 100%; height: 100%; object-fit: contain; padding: 15px; }

        .card-content { padding: 22px; }
        .tag { background: #f7ede8; color: #ff4500; font-size: 10px; padding: 4px 12px; border-radius: 20px; font-weight: 700; }
        
        .btn-comprar {
            display: block; width: 100%; background: #2c2418; color: white;
            padding: 12px; border-radius: 40px; text-align: center; text-decoration: none;
            font-weight: 600; margin-top: 15px; transition: .3s;
        }
        .btn-comprar:hover { background: #ff4500; }

        .loader { text-align: center; padding: 40px; color: #c9a87b; grid-column: 1/-1; }

        footer { background: #1a1208; color: #8a7a60; text-align: center; padding: 40px; margin-top: 40px; font-size: 12px; }

        @media (max-width: 768px) { .viral-header h1 { font-size: 1.8rem; } }
    </style>
</head>
<body>

    <div class="viral-header">
        <h1>🔥 The Secret <span>Women Are Talking About</span> in 2026</h1>
        <p>What NYC, Miami & Beverly Hills elites don't want you to know</p>
        <div class="live-badge">⚡ LIVE TRENDS ⚡</div>
    </div>

    <div class="container">
        <!-- SECCIÓN CURIOSIDADES -->
        <div class="curiosidades-section">
            <h2 class="section-title">💎 Curiosidades Exclusivas</h2>
            <div id="curiosidadesGrid" class="curiosidades-grid">
                <div class="loader">🔥 Cargando secretos...</div>
            </div>
        </div>

        <!-- SECCIÓN PRODUCTOS -->
        <div class="productos-section">
            <h2 class="section-title">🛍️ Artículos Exclusivos</h2>
            <div id="productosGrid" class="productos-grid">
                <div class="loader">💎 Cargando artículos de lujo...</div>
            </div>
        </div>
    </div>

    <footer>
        <p>© 2026 MXL GOLD MINER — Luxury Lifestyle & Status</p>
    </footer>

    <script>
        // FUNCIÓN CARGAR PRODUCTOS (Sincronizada con /api/productos)
        async function cargarProductos() {
            try {
                const res = await fetch('/api/productos');
                const productos = await res.json();
                const grid = document.getElementById('productosGrid');
                
                if (!productos || productos.length === 0) {
                    grid.innerHTML = '<div class="loader">💰 Inyecta tu primer producto desde el panel MXL</div>';
                    return;
                }

                grid.innerHTML = productos.map(p => `
                    <div class="card" onclick="window.open('${p.link}', '_blank')">
                        <div class="card-img">
                            <img src="${p.imagen}" onerror="this.src='https://images.pexels.com/photos/280229/pexels-photo-280229.jpeg'">
                        </div>
                        <div class="card-content">
                            <span class="tag">${p.categoria || 'LUXURY'}</span>
                            <h3 style="margin: 10px 0; font-family: Playfair Display;">${p.titulo}</h3>
                            <p style="font-size: 0.9rem; color: #6b5a48;">${p.curiosidad || ''}</p>
                            <a href="${p.link}" class="btn-comprar" target="_blank">VER EN AMAZON</a>
                        </div>
                    </div>
                `).join('');
            } catch(e) { console.error(e); }
        }

        // FUNCIÓN CARGAR CURIOSIDADES
        async function cargarCuriosidades() {
            try {
                const res = await fetch('/api/curiosidades');
                const data = await res.json();
                const grid = document.getElementById('curiosidadesGrid');
                
                if (!data || data.length === 0) {
                    grid.innerHTML = '<div class="loader">✨ Generando secretos con Gemini...</div>';
                    return;
                }

                grid.innerHTML = data.map(c => `
                    <div class="card">
                        <div class="card-img" style="height: 200px;">
                            <img src="${c.imagen}" style="object-fit: cover; padding: 0;">
                        </div>
                        <div class="card-content">
                            <h3 style="font-size: 1.1rem;">${c.titulo_es}</h3>
                            <p style="font-size: 0.85rem; margin-top: 10px;">${c.texto_es}</p>
                        </div>
                    </div>
                `).join('');
            } catch(e) { console.error(e); }
        }

        // Inicializar y refrescar cada 30 seg
        cargarProductos();
        cargarCuriosidades();
        setInterval(() => { cargarProductos(); cargarCuriosidades(); }, 30000);
    </script>
</body>
</html>
