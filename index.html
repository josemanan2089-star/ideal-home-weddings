<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel MXL - Control de Ventas</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;}
        body{font-family:system-ui,sans-serif;background:#0f0f1a;color:#fff;padding:20px;}
        .header{background:linear-gradient(135deg,#1a1a2e,#2d2d44);padding:20px;border-radius:16px;margin-bottom:20px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;}
        h1{font-size:1.5rem;}
        .stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:15px;margin-bottom:20px;}
        .stat-card{background:#1a1a2e;padding:20px;border-radius:12px;text-align:center;}
        .stat-number{font-size:2rem;font-weight:bold;color:#ff4500;}
        .btn{background:#ff4500;color:#fff;border:none;padding:10px 20px;border-radius:8px;cursor:pointer;margin:5px;}
        .btn:hover{background:#ff6b35;}
        .btn-danger{background:#dc2626;}
        .btn-danger:hover{background:#ef4444;}
        .section{background:#1a1a2e;border-radius:12px;padding:20px;margin-top:20px;}
        .section h3{margin-bottom:15px;color:#ff4500;}
        .curiosidad-item,.producto-item{border-bottom:1px solid #2d2d44;padding:15px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;}
        .curiosidad-item:last-child,.producto-item:last-child{border-bottom:none;}
        .curiosidad-titulo{flex:1;font-size:0.9rem;}
        .producto-titulo{flex:1;font-size:0.9rem;}
        .small-btn{background:#2d2d44;padding:5px 12px;border-radius:6px;font-size:12px;margin-left:10px;}
        .small-btn:hover{background:#ff4500;}
        .empty{text-align:center;padding:40px;color:#666;}
        .modal{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.8);align-items:center;justify-content:center;z-index:1000;}
        .modal-content{background:#1a1a2e;padding:30px;border-radius:16px;max-width:500px;width:90%;}
        .modal-content input,.modal-content textarea{width:100%;padding:10px;margin:10px 0;border-radius:8px;border:none;background:#2d2d44;color:#fff;}
        .modal-content textarea{min-height:100px;}
        .form-group{margin-bottom:15px;}
        label{display:block;margin-bottom:5px;font-size:12px;color:#c9a87b;}
        select{width:100%;padding:10px;border-radius:8px;background:#2d2d44;color:#fff;border:none;}
        @media(max-width:600px){.curiosidad-item,.producto-item{flex-direction:column;align-items:flex-start;gap:10px;}}
    </style>
</head>
<body>
    <div class="header">
        <h1>🏮 MXL GOLD MINER - PANEL DE CONTROL</h1>
        <div>
            <button class="btn" onclick="generarCuriosidad()">✨ Generar Curiosidad</button>
            <button class="btn" onclick="abrirModalProducto()">📦 Nuevo Producto</button>
            <button class="btn btn-danger" onclick="borrarTodasCuriosidades()">🗑️ Borrar Todo</button>
        </div>
    </div>

    <div class="stats-grid" id="statsGrid">
        <div class="stat-card">🤖 Gemini<br><span id="geminiStatus" class="stat-number">-</span></div>
        <div class="stat-card">🎯 Ángulo<br><span id="anguloStatus" class="stat-number">-</span></div>
        <div class="stat-card">💎 Curiosidades<br><span id="curiosidadesCount" class="stat-number">0</span></div>
        <div class="stat-card">💰 Productos<br><span id="productosCount" class="stat-number">0</span></div>
        <div class="stat-card">🖱️ Clics<br><span id="clicsCount" class="stat-number">0</span></div>
    </div>

    <div class="section">
        <h3>📰 CURIOSIDADES RECIENTES</h3>
        <div id="curiosidadesList"></div>
    </div>

    <div class="section">
        <h3>🛍️ PRODUCTOS PUBLICADOS</h3>
        <div id="productosList"></div>
    </div>

    <!-- Modal para nuevo producto -->
    <div id="modalProducto" class="modal">
        <div class="modal-content">
            <h3>📦 Nuevo Producto Exclusivo</h3>
            <div class="form-group">
                <label>URL de Amazon *</label>
                <input type="text" id="productoUrl" placeholder="https://www.amazon.com/dp/XXXXXXXXXX">
            </div>
            <div class="form-group">
                <label>URL de Imagen *</label>
                <input type="text" id="productoImagen" placeholder="https://...">
            </div>
            <div class="form-group">
                <label>Categoría</label>
                <select id="productoCategoria">
                    <option value="LUXURY">LUXURY</option>
                    <option value="SMART HOME">SM
