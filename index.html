<script>
    // 🛡️ ESCUDO MXL: Evita que tus visitas cuenten en las estadísticas
    const isAdmin = localStorage.getItem('mxl_admin_session') || window.location.href.includes('mxl-panel');
    if(window.location.href.includes('mxl-panel')) {
        localStorage.setItem('mxl_admin_session', 'true');
    }

    async function loadEngine() {
        const res = await fetch('/api/productos');
        const data = await res.json();
        const grid = document.getElementById('mainGrid');
        grid.innerHTML = '';

        data.items.forEach((p, index) => {
            const reviews = (Math.random() * 2000 + 500).toFixed(0);
            const soldToday = (Math.random() * 50 + 10).toFixed(0);
            
            // 🔥 FILTRO ANT-SOCIO: Solo trackea si NO eres tú revisando
            if (!isAdmin) {
                fetch('/api/track/impression', { 
                    method: 'POST', 
                    headers: {'Content-Type': 'application/json'}, 
                    body: JSON.stringify({id: p.id}) 
                });
            } else {
                console.log("🛡️ Escudo MXL Activo: Tu visita no está siendo contada.");
            }

            const card = `
                <article class="card">
                    <div class="card-img"><img src="${p.imagen}" alt="${p.titulo}"></div>
                    <div class="card-content">
                        <div class="rating">⭐⭐⭐⭐⭐ <span>(${reviews} reviews)</span></div>
                        <h2 class="product-title">${p.titulo}</h2>
                        <div class="fomo-box">
                            <div class="fomo-text">🔥 ${soldToday} BOUGHT IN NEW YORK TODAY</div>
                            <div style="font-size: 10px; color: #ff3b30; font-weight: 800; margin-top: 5px;">⚡ GOING VIRAL ON TIKTOK</div>
                        </div>
                        <div class="price-box">
                            <span class="price-now">$${p.precio}</span>
                            <span class="price-old">$${(p.precio * 1.4).toFixed(2)}</span>
                            <span class="save-tag">SAVE 40%</span>
                        </div>
                        <button class="btn-buy" onclick="window.open('/go/${p.id}', '_blank')">
                            ⚡ CLAIM DISCOUNT ON AMAZON
                        </button>
                    </div>
                </article>
            `;
            grid.innerHTML += card;
            
            if ((index + 1) % 3 === 0) {
                grid.innerHTML += `<div class="trap-banner"><h2>💎 VIP LUXURY ACCESS</h2><p>Don't miss the drops. Prices rise at midnight.</p></div>`;
            }
        });
    }

    // ... (El resto de funciones subscribeVIP, startTimer y onload se mantienen igual)
</script>
