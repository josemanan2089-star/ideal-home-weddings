<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ideal Home & Weddings | Silent Luxury for Modern Homes</title>
    <meta name="description" content="Curated luxury home essentials for the discerning couple. Smart home gadgets, zero-waste status symbols, and wedding registry must-haves.">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Inter', sans-serif;
            background: #faf9f8;
            color: #1a1a1a;
        }
        
        /* Header de Lujo */
        .luxury-header {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: white;
            padding: 60px 20px;
            text-align: center;
            position: relative;
            overflow: hidden;
        }
        
        .luxury-header::before {
            content: "✦";
            position: absolute;
            font-size: 300px;
            opacity: 0.03;
            right: -50px;
            top: -50px;
            font-family: serif;
        }
        
        .header-content {
            max-width: 800px;
            margin: 0 auto;
            position: relative;
            z-index: 1;
        }
        
        .header-content h1 {
            font-size: 3rem;
            font-weight: 300;
            letter-spacing: -0.5px;
        }
        
        .header-content h1 span {
            font-weight: 700;
            background: linear-gradient(135deg, #f5af19, #f12711);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        
        .lang-switch {
            margin-top: 30px;
        }
        
        .lang-btn {
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.3);
            color: white;
            padding: 8px 20px;
            margin: 0 5px;
            border-radius: 30px;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .lang-btn.active {
            background: linear-gradient(135deg, #f5af19, #f12711);
            border-color: transparent;
        }
        
        /* Grid de Productos - Estilo Revista */
        .magazine-grid {
            max-width: 1200px;
            margin: 60px auto;
            padding: 0 20px;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 40px;
        }
        
        .article-card {
            background: white;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            cursor: pointer;
        }
        
        .article-card:hover {
            transform: translateY(-10px);
            box-shadow: 0 25px 40px rgba(0,0,0,0.15);
        }
        
        .image-container {
            position: relative;
            overflow: hidden;
            background: #f5f5f5;
            height: 280px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .image-container img {
            transition: transform 0.6s;
            object-fit: contain;
            width: 100%;
            height: 100%;
        }
        
        .article-card:hover .image-container img {
            transform: scale(1.05);
        }
        
        /* Tamaños de imagen */
        .image-small img { padding: 30px; }
        .image-medium img { padding: 20px; }
        .image-large img { padding: 10px; }
        
        /* Posiciones de imagen */
        .position-left { justify-content: flex-start; }
        .position-center { justify-content: center; }
        .position-right { justify-content: flex-end; }
        
        .content {
            padding: 25px;
        }
        
        .badge {
            display: inline-block;
            background: linear-gradient(135deg, #f5af19, #f12711);
            color: white;
            font-size: 11px;
            font-weight: 600;
            padding: 4px 12px;
            border-radius: 20px;
            margin-bottom: 15px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        .content h2 {
            font-size: 1.5rem;
            margin-bottom: 12px;
            line-height: 1.3;
        }
        
        .curiosity {
            font-size: 0.9rem;
            color: #666;
            margin-bottom: 15px;
            font-style: italic;
            border-left: 3px solid #f5af19;
            padding-left: 15px;
        }
        
        .description {
            color: #444;
            line-height: 1.6;
            margin-bottom: 20px;
            font-size: 0.95rem;
        }
        
        .btn-shop {
            display: inline-block;
            background: #1a1a2e;
            color: white;
            padding: 12px 30px;
            text-decoration: none;
            border-radius: 40px;
            font-weight: 600;
            transition: all 0.3s;
            border: none;
            cursor: pointer;
            width: 100%;
            text-align: center;
        }
        
        .btn-shop:hover {
            background: linear-gradient(135deg, #f5af19, #f12711);
            transform: translateX(5px);
        }
        
        footer {
            background: #1a1a2e;
            color: white;
            text-align: center;
            padding: 40px;
            margin-top: 60px;
        }
        
        @media (max-width: 768px) {
            .magazine-grid {
                grid-template-columns: 1fr;
            }
            .header-content h1 {
                font-size: 2rem;
            }
        }
    </style>
</head>
<body>
    <div class="luxury-header">
        <div class="header-content">
            <h1>Ideal Home & <span>Weddings</span></h1>
            <p style="margin-top: 20px; opacity: 0.8;">Curated silent luxury for the modern household</p>
            <div class="lang-switch">
                <button class="lang-btn active" onclick="setLanguage('en')">ENGLISH</button>
                <button class="lang-btn" onclick="setLanguage('es')">ESPAÑOL</button>
            </div>
        </div>
    </div>
    
    <div class="magazine-grid" id="productGrid"></div>
    
    <footer>
        <p>© 2026 Ideal Home & Weddings. As an Amazon Associate we earn from qualifying purchases.</p>
        <p style="margin-top: 10px; font-size: 12px;">Silent Luxury | Zero-Waste Status | Smart Home Curated</p>
    </footer>
    
    <script>
        let currentLang = 'en';
        let products = [];
        
        async function loadProducts() {
            const res = await fetch('/api/productos');
            products = await res.json();
            renderProducts();
        }
        
        function renderProducts() {
            const grid = document.getElementById('productGrid');
            grid.innerHTML = products.map(product => {
                const title = currentLang === 'en' ? (product.title_en || product.title) : (product.title_es || product.title);
                const curiosity = currentLang === 'en' ? product.curiosity_en : product.curiosity_es;
                const description = currentLang === 'en' ? product.description_en : product.description_es;
                
                // Clases para tamaño y posición
                const sizeClass = `image-${product.imageSize || 'medium'}`;
                const positionClass = `position-${product.imagePosition || 'center'}`;
                
                return `
                    <div class="article-card" onclick="trackClick(${product.id})">
                        <div class="image-container ${sizeClass} ${positionClass}">
                            <img src="${product.image}" alt="${title}" onerror="this.src='https://via.placeholder.com/400x300?text=Product'">
                        </div>
                        <div class="content">
                            <span class="badge">✦ CURATED PICK</span>
                            <h2>${title || 'Premium Product'}</h2>
                            ${curiosity ? `<div class="curiosity">✨ ${curiosity}</div>` : ''}
                            ${description ? `<div class="description">${description}</div>` : ''}
                            <a href="${product.link}" class="btn-shop" target="_blank" onclick="event.stopPropagation(); registerClick(${product.id})">
                                ${currentLang === 'en' ? '✨ DISCOVER ON AMAZON →' : '✨ DESCUBRE EN AMAZON →'}
                            </a>
                        </div>
                    </div>
                `;
            }).join('');
        }
        
        async function registerClick(productId) {
            await fetch(`/api/click/${productId}`, { method: 'POST' });
        }
        
        function trackClick(productId) {
            // Para analytics futuro
            console.log('Clicked product:', productId);
        }
        
        function setLanguage(lang) {
            currentLang = lang;
            document.querySelectorAll('.lang-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            renderProducts();
        }
        
        loadProducts();
        setInterval(loadProducts, 30000); // Recargar cada 30 segundos
    </script>
</body>
</html>
