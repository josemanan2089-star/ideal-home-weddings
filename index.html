<!DOCTYPE html>
<html lang="en-US">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MXL Gold | 🔥 Trending Luxury Finds — NYC · MIA · LA</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Playfair+Display:ital,wght@0,700;1,700&display=swap" rel="stylesheet">
    <style>
        :root {
            --black: #0a0a0a;
            --gold: #d4af37;
            --fire: #ff3b30;
            --safe: #34c759;
            --gray: #f2f2f7;
            --text: #1c1c1e;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { font-family: 'Inter', sans-serif; background: #fff; color: var(--text); line-height: 1.5; }

        /* 🔥 TOP URGENCY BAR */
        .top-bar {
            background: var(--black);
            color: #fff;
            padding: 8px;
            font-size: 11px;
            font-weight: 700;
            text-align: center;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .top-bar span { color: var(--gold); }

        /* 🚀 NAVIGATION */
        nav {
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #eee;
            position: sticky;
            top: 0;
            background: rgba(255,255,255,0.9);
            backdrop-filter: blur(10px);
            z-index: 1000;
        }
        .logo { font-family: 'Playfair Display', serif; font-size: 22px; font-weight: 800; letter-spacing: -1px; }
        .logo span { color: var(--gold); }
        
        .live-status { display: flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; color: var(--safe); }
        .dot { width: 8px; height: 8px; background: var(--safe); border-radius: 50%; animation: pulse 1.5s infinite; }

        /* 💎 HERO SECTION (ESTILO USA) */
        .hero { padding: 40px 20px; text-align: center; background: var(--gray); }
        .hero h1 { font-family: 'Playfair Display', serif; font-size: 32px; margin-bottom: 10px; line-height: 1.1; }
        .hero p { font-size: 14px; color: #666; margin-bottom: 20px; }
        .trending-badge { 
            display: inline-block; 
            background: var(--black); 
            color: #fff; 
            padding: 5px 15px; 
            border-radius: 20px; 
            font-size: 10px; 
            font-weight: 800; 
            text-transform: uppercase;
        }

        /* 📦 PRODUCT GRID */
        .grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); 
            gap: 20px; 
            padding: 20px; 
            max-width: 1200px; 
            margin: 0 auto; 
        }

        /* 🃏 LUXURY CARD */
        .card {
            background: #fff;
            border-radius: 16px;
            border: 1px solid #efefef;
            overflow: hidden;
            position: relative;
            transition: transform 0.3s ease;
        }
        .card:active { transform: scale(0.98); }

        /* BADGES */
        .badge-hot { 
            position: absolute; top: 15px; left: 15px; 
            background: var(--fire); color: #fff; 
            padding: 4px 10px; border-radius: 4px; 
            font-size: 11px; font-weight: 800; z-index: 10;
        }

        .card-img { width: 100%; aspect-ratio: 1; background: #fff; display: flex; align-items: center; justify-content: center; padding: 10px; }
        .card-img img { max-width: 100%; max-height: 100%; object-fit: contain; }

        .card-content { padding: 20px; }
        .rating { color: #ffcc00; font-size: 13px; margin-bottom: 5px; }
        .rating span { color: #888; font-size: 11px; margin-left: 5px; }

        .product-title { font-size: 16px; font-weight: 700; margin-bottom: 8px; height: 44px; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
        
        /* 🔥 FOMO & URGENCY */
        .fomo-box { 
            background: #fff0f0; 
            border-radius: 8px; 
            padding: 8px; 
            margin-bottom: 15px; 
            border-left: 3px solid var(--fire); 
        }
        .fomo-text { font-size: 12px; font-weight: 700; color: var(--fire); display: flex; align-items: center; gap: 5px; }
        .stock-bar { width: 100%; height: 4px; background: #e0e0e0; border-radius: 10px; margin-top: 5px; overflow: hidden; }
        .stock-progress { width: 30%; height: 100%; background: var(--fire); border-radius: 10px; }

        .price-box { display: flex; align-items: baseline; gap: 10px; margin-bottom: 15px; }
        .price-now { font-size: 24px; font-weight: 800; color: var(--black); }
        .price-old { font-size: 16px; text-decoration: line-through; color: #888; }
        .discount { color: var(--safe); font-size: 14px; font-weight: 700; }

        /* 💰 CONVERSION BUTTON */
        .btn-buy {
            width: 100%;
            background: var(--black);
            color: #fff;
            border: none;
            padding: 16px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 800;
            text-transform: uppercase;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
        }
        .btn-buy:hover { background: #333; }

        /* 📱 MOBILE FIXES */
        @media (max-width: 480px) {
            .grid { grid-template-columns: 1fr; padding: 15px; }
            .hero h1 { font-size: 28px; }
        }

        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.4; } 100% { opacity: 1; } }
    </style>
</head>
<body>

<div class="top-bar">🔥 <span>Flash Sale:</span> 50% OFF TODAY · FREE SHIPPING TO USA 📦</div>

<nav>
    <div class="logo">MXL <span>GOLD</span></div>
    <div class="live-status">
        <div class="dot"></div>
        <span id="viewer-count">124</span> Browsing Now
    </div>
</nav>

<header class="hero">
    <div class="trending-badge">Verified USA Trends</div>
    <h1>The Luxury Edit <em>2026</em></h1>
    <p>Handpicked by AI from NYC, Miami & LA elite wishlists.</p>
</header>

<main class="grid" id="mainGrid">
    <!-- PRODUCT SKELETON (LOADER) -->
    <div style="text-align:center; grid-column: 1/-1; padding: 50px; color: #888;">
        Loading Elite Selection...
    </div>
</main>

<footer style="padding: 40px 20px; text-align: center; border-top: 1px solid #eee; font-size: 12px; color: #888;">
    <p>© 2026 MXL GOLD USA. As an Amazon Associate, we earn from qualifying purchases.</p>
</footer>

<script>
    const STORAGE_KEY = 'mxl_gold_visited';

    async function loadEngine() {
        try {
            const res = await fetch('/api/productos');
            const data = await res.json();
            const items = data.items || [];
            
            const grid = document.getElementById('mainGrid');
            grid.innerHTML = '';

            items.forEach(p => {
                // PSICOLOGÍA DE DATOS
                const rating = (4.5 + Math.random() * 0.4).toFixed(1);
                const reviews = Math.floor(Math.random() * 3000) + 500;
                const fakeOldPrice = (parseFloat(p.precio) * 1.5).toFixed(2);
                const stockLeft = Math.floor(Math.random() * 5) + 2;
                const peopleViewing = Math.floor(Math.random() * 40) + 12;

                // TRACK IMPRESSION
                fetch('/api/track/impression', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({id: p.id})
                });

                const card = `
                <article class="card">
                    <div class="badge-hot">🔥 SELLING FAST</div>
                    <div class="card-img">
                        <img src="${p.imagen}" alt="${p.titulo}">
                    </div>
                    <div class="card-content">
                        <div class="rating">⭐⭐⭐⭐⭐ <span>(${reviews} reviews)</span></div>
                        <h2 class="product-title">${p.titulo}</h2>
                        
                        <div class="fomo-box">
                            <div class="fomo-text">⚡ ${peopleViewing} people viewing right now</div>
                            <div style="font-size: 10px; color: #ff3b30; font-weight: 800; margin-top: 5px;">
                                ONLY ${stockLeft} LEFT IN STOCK
                            </div>
                            <div class="stock-bar"><div class="stock-progress" style="width: ${stockLeft * 20}%"></div></div>
                        </div>

                        <div class="price-box">
                            <span class="price-now">$${p.precio}</span>
                            <span class="price-old">$${fakeOldPrice}</span>
                            <span class="discount">Save 50%</span>
                        </div>

                        <button class="btn-buy" onclick="window.open('/go/${p.id}', '_blank')">
                            View on Amazon ⚡
                        </button>
                    </div>
                </article>
                `;
                grid.innerHTML += card;
            });
        } catch (e) {
            console.error("Engine Error");
        }
    }

    // DINAMISMO EN VIVO
    setInterval(() => {
        const count = Math.floor(Math.random() * 50) + 100;
        document.getElementById('viewer-count').innerText = count;
    }, 5000);

    // INICIAR
    loadEngine();
</script>
</body>
</html>
