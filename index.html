<!DOCTYPE html>
<html lang="en-US">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>MXL Gold | 🔥 Luxury Finds Selling Fast — NYC, Miami & LA</title>
    <!-- ... (Tus metas se mantienen igual para el SEO) ... -->
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --black: #0a0a0a;
            --gold: #c9a87b;
            --gold-dark: #a8885a;
            --fire: #ff3300;
            --surface: #f8f7f5;
            --border: #e8e6e0;
            --text: #0a0a0a;
            --radius-lg: 24px;
        }

        /* ── AJUSTE CRÍTICO: GRID CENTRADO ── */
        .grid {
            display: grid;
            /* Se adapta al ancho, pero centrado */
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); 
            gap: 25px;
            max-width: 1200px; /* Ancho máximo de boutique */
            margin: 0 auto;   /* ESTO CENTRA TODO EL BLOQUE */
            justify-content: center;
            justify-items: center; /* Centra las tarjetas dentro de su celda */
        }

        /* ── ESTILO DE TARJETAS ── */
        .card {
            background: #ffffff;
            border-radius: var(--radius-lg);
            border: 1px solid var(--border);
            overflow: hidden;
            width: 100%;
            max-width: 340px; /* Tamaño ideal para móvil y desktop */
            transition: transform 0.3s ease;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }

        .card:hover { transform: translateY(-8px); }

        .card-img {
            width: 100%;
            aspect-ratio: 1;
            background: #fdfdfd;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .card-img img { width: 85%; height: 85%; object-fit: contain; }

        .card-body { padding: 20px; text-align: left; }
        
        .card-price {
            font-size: 1.3rem;
            font-weight: 700;
            color: var(--black);
            margin-bottom: 10px;
        }

        /* ── CSS GENERAL ── */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'DM Sans', sans-serif; background: var(--surface); color: var(--text); }
        
        /* Ticker, Nav y Hero (Simplificados para brevedad, mantén tus estilos originales aquí) */
        .ticker { background: var(--black); color: var(--gold); padding: 10px; text-align: center; font-size: 0.7rem; font-weight: bold; text-transform: uppercase; }
        nav { background: #fff; padding: 15px 25px; display: flex; justify-content: space-between; border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 100; }
        .hero { background: var(--black); color: #fff; padding: 60px 20px; text-align: center; }
        .hero h1 { font-family: 'Cormorant Garamond', serif; font-size: 2.5rem; margin-bottom: 15px; }
        
        .card-cta {
            width: 100%;
            background: var(--black);
            color: #fff;
            border: none;
            padding: 12px;
            border-radius: 50px;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
            font-size: 0.8rem;
        }
        .card-cta:hover { background: var(--fire); }

        /* Estilo para los filtros */
        .filters-wrap { padding: 20px; text-align: center; }
        .chip { padding: 8px 20px; border-radius: 50px; border: 1px solid var(--border); background: #fff; margin: 5px; cursor: pointer; }
        .chip.active { background: var(--black); color: #fff; }
    </style>
</head>
<body>

<div class="ticker">✦ FREE PRIME SHIPPING ON ALL ITEMS · NYC · MIAMI · LA ✦</div>

<nav>
    <div style="font-family: 'Cormorant Garamond', serif; font-size: 1.5rem; font-weight: bold;">MXL <span style="color:var(--gold)">Gold</span></div>
</nav>

<header class="hero">
    <h1>The Luxury Edit <br><em>Elite Women Love</em></h1>
    <p style="color: #888;">Curated from NYC, Miami & LA Hills.</p>
</header>

<div class="filters-wrap" id="filtersEl">
    <button class="chip active">All Products</button>
</div>

<main style="padding: 40px 20px;">
    <div id="grid" class="grid">
        <!-- Los productos se cargan aquí -->
    </div>
</main>

<script>
// ===================================================
// LÓGICA DE CARGA MXL GOLD v7.5 (Sincronizada con Server)
// ===================================================

async function loadProducts() {
    const grid = document.getElementById('grid');
    try {
        const res = await fetch('/api/productos');
        const data = await res.json();
        const items = data.items || [];

        if (items.length === 0) {
            grid.innerHTML = "<p style='color:#888'>Wait list is currently empty...</p>";
            return;
        }

        grid.innerHTML = items.map(p => {
            // AJUSTE DE PRECIO: Siempre mostrar en USD
            const price = parseFloat(p.precio) || 49.99;
            
            return `
            <article class="card">
                <div class="card-img">
                    <img src="${p.imagen}" alt="${p.titulo}">
                </div>
                <div class="card-body">
                    <small style="color:var(--gold); font-weight:bold; text-transform:uppercase; font-size:0.6rem;">${p.categoria || 'Luxury'}</small>
                    <h3 style="font-family:'Cormorant Garamond', serif; font-size:1.1rem; margin: 5px 0 10px;">${p.titulo}</h3>
                    
                    <!-- EL CAMBIO CLAVE: FORMATO USD -->
                    <div class="card-price">$${price.toFixed(2)} <span style="font-size:0.7rem; color:#10b981;">USD</span></div>
                    
                    <button class="card-cta" onclick="window.open('/go/${p.id}', '_blank')">Buy on Amazon ⚡</button>
                </div>
            </article>
            `;
        }).join('');
    } catch (e) {
        grid.innerHTML = "<p>Error connecting to engine...</p>";
    }
}

loadProducts();
</script>
</body>
</html>
