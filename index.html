<!DOCTYPE html>
<html lang="en-US">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MXL Gold | ⚡ Limited Luxury Deals — NYC · MIA · LA</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;800&family=Playfair+Display:ital,wght@0,800;1,800&display=swap" rel="stylesheet">
    <style>
        :root { --black: #050505; --gold: #d4af37; --fire: #ff3b30; --safe: #34c759; --gray: #f2f2f7; }
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { font-family: 'Inter', sans-serif; background: #fff; color: var(--black); overflow-x: hidden; }
        .urgency-header { background: var(--fire); color: #fff; padding: 10px; font-size: 12px; font-weight: 800; text-align: center; text-transform: uppercase; letter-spacing: 1px; position: sticky; top: 0; z-index: 1001; }
        #timer { color: #fff; background: rgba(0,0,0,0.2); padding: 2px 8px; border-radius: 4px; margin-left: 5px; }
        nav { padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; background: #fff; border-bottom: 1px solid #eee; position: sticky; top: 38px; z-index: 1000; }
        .logo { font-family: 'Playfair Display', serif; font-size: 22px; font-weight: 800; }
        .logo span { color: var(--gold); }
        .live { color: var(--safe); font-size: 12px; font-weight: 700; display: flex; align-items: center; gap: 5px; }
        .dot { width: 8px; height: 8px; background: var(--safe); border-radius: 50%; animation: pulse 1.5s infinite; }
        .featured-hero { background: var(--gray); padding: 40px 20px; text-align: center; border-bottom: 1px solid #ddd; }
        .best-seller-tag { background: var(--gold); color: #fff; padding: 5px 15px; border-radius: 4px; font-size: 11px; font-weight: 800; margin-bottom: 15px; display: inline-block; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 20px; padding: 20px; max-width: 1200px; margin: 0 auto; }
        .card { background: #fff; border-radius: 16px; border: 1px solid #efefef; overflow: hidden; position: relative; transition: 0.3s; }
        .card-img { width: 100%; aspect-ratio: 1; display: flex; align-items: center; justify-content: center; padding: 20px; }
        .card-img img { max-width: 100%; max-height: 100%; object-fit: contain; }
        .card-content { padding: 20px; }
        .rating { color: #ffcc00; font-size: 13px; margin-bottom: 5px; }
        .product-title { font-size: 17px; font-weight: 700; margin-bottom: 10px; height: 44px; overflow: hidden; line-height: 1.2; }
        .fomo-box { background: #fff0f0; border-radius: 8px; padding: 10px; margin-bottom: 15px; border-left: 4px solid var(--fire); }
        .fomo-text { font-size: 12px; font-weight: 800; color: var(--fire); }
        .price-box { display: flex; align-items: baseline; gap: 8px; margin-bottom: 15px; }
        .price-now { font-size: 26px; font-weight: 800; }
        .price-old { font-size: 16px; text-decoration: line-through; color: #888; }
        .save-tag { color: var(--safe); font-size: 14px; font-weight: 800; }
        .btn-buy { width: 100%; background: var(--black); color: #fff; border: none; padding: 18px; border-radius: 12px; font-size: 15px; font-weight: 800; text-transform: uppercase; cursor: pointer; transition: 0.2s; box-shadow: 0 10px 20px rgba(0,0,0,0.1); }
        .popup-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 2000; align-items: center; justify-content: center; padding: 20px; }
        .popup-box { background: #fff; padding: 30px; border-radius: 20px; text-align: center; max-width: 400px; position: relative; border: 4px solid var(--gold); }
        .btn-vip { background: var(--gold); color: #fff; border: none; padding: 15px; width: 100%; border-radius: 10px; font-weight: 800; cursor: pointer; }
        .trap-banner { grid-column: 1 / -1; background: var(--black); color: #fff; padding: 40px; border-radius: 20px; text-align: center; margin: 20px 0; }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.3; } 100% { opacity: 1; } }
    </style>
</head>
<body>

<div class="urgency-header">⚠️ PRICE DROPS EXPIRE IN: <span id="timer">14:59</span></div>
<nav>
    <div class="logo">MXL <span>GOLD</span></div>
    <div class="live"><div class="dot"></div> <span id="view-count">144</span> browsing right now</div>
</nav>

<header class="featured-hero">
    <div class="best-seller-tag">🏆 TODAY'S #1 BEST SELLER</div>
    <h1 style="font-family: 'Playfair Display', serif; font-size: 36px;">Trending in <em>New York</em></h1>
</header>

<main class="grid" id="mainGrid"></main>

<div class="popup-overlay" id="vipPopup">
    <div class="popup-box">
        <div style="font-size: 40px;">🎁</div>
        <h2>Secret Deals?</h2>
        <p>Get **10% OFF** and access to VIP-only finds.</p>
        <input type="email" placeholder="Enter your email" id="vipEmail" style="width:100%; padding:15px; margin:15px 0; border:1px solid #ddd; border-radius:10px;">
        <button class="btn-vip" onclick="subscribeVIP()">GET MY DISCOUNT ⚡</button>
    </div>
</div>

<script>
    // 🛡️ ESCUDO MXL: No contar las visitas del jefe
    const isAdmin = localStorage.getItem('mxl_admin_session') || window.location.href.includes('mxl-panel');
    if(window.location.href.includes('mxl-panel')) { localStorage.setItem('mxl_admin_session', 'true'); }

    async function loadEngine() {
        const res = await fetch('/api/productos');
        const data = await res.json();
        const grid = document.getElementById('mainGrid');
        grid.innerHTML = '';

        data.items.forEach((p, index) => {
            const reviews = (Math.random() * 2000 + 500).toFixed(0);
            const soldToday = (Math.random() * 50 + 10).toFixed(0);
            
            if (!isAdmin) {
                fetch('/api/track/impression', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({id: p.id}) });
            }

            grid.innerHTML += `
                <article class="card">
                    <div class="card-img"><img src="${p.imagen}" alt="${p.titulo}"></div>
                    <div class="card-content">
                        <div class="rating">⭐⭐⭐⭐⭐ <span>(${reviews} reviews)</span></div>
                        <h2 class="product-title">${p.titulo}</h2>
                        <div class="fomo-box">
                            <div class="fomo-text">🔥 ${soldToday} BOUGHT IN NEW YORK TODAY</div>
                        </div>
                        <div class="price-box">
                            <span class="price-now">$${p.precio}</span>
                            <span class="price-old">$${(p.precio * 1.4).toFixed(2)}</span>
                            <span class="save-tag">SAVE 40%</span>
                        </div>
                        <button class="btn-buy" onclick="window.open('/go/${p.id}', '_blank')">⚡ CLAIM DISCOUNT ON AMAZON</button>
                    </div>
                </article>
            `;
            if ((index + 1) % 3 === 0) {
                grid.innerHTML += `<div class="trap-banner"><h2>💎 VIP LUXURY ACCESS</h2><p>Prices rise at midnight.</p></div>`;
            }
        });
    }

    async function subscribeVIP() {
        const email = document.getElementById('vipEmail').value;
        if (!email.includes('@')) return alert("Enter valid email");
        const res = await fetch('/api/subscribe', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ email }) });
        if(res.ok) { alert("WELCOME VIP! Code: MXLGOLD10"); closePopup(); }
    }

    function startTimer(duration, display) {
        let timer = duration, min, sec;
        setInterval(() => {
            min = parseInt(timer / 60, 10); sec = parseInt(timer % 60, 10);
            display.textContent = (min < 10 ? "0" + min : min) + ":" + (sec < 10 ? "0" + sec : sec);
            if (--timer < 0) timer = duration;
        }, 1000);
    }

    window.onload = () => {
        loadEngine();
        startTimer(900, document.querySelector('#timer'));
        setTimeout(() => { if(!localStorage.getItem('mxl_vip')) document.getElementById('vipPopup').style.display = 'flex'; }, 8000);
    };

    function closePopup() { localStorage.setItem('mxl_vip', 'true'); document.getElementById('vipPopup').style.display = 'none'; }
    setInterval(() => { document.getElementById('view-count').innerText = Math.floor(Math.random() * 20) + 140; }, 4000);
</script>
</body>
</html>
