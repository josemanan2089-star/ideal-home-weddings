<!DOCTYPE html>
<html lang="en-US">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>COMMANDER MXL — Panel v11.0 | LEAD CONTROL</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;}
        body{font-family:system-ui,sans-serif;background:#05050a;color:#fff;padding:15px;font-size:14px;}
        .header{background:linear-gradient(135deg,#1a1a2e,#000);padding:20px;border-radius:15px;margin-bottom:15px;border:1px solid #8b5cf6; text-align: center;}
        h1{font-size:1.3rem;margin-bottom:10px;color:#fff;letter-spacing:1px;}
        .v-badge{background:#8b5cf6;padding:3px 10px;border-radius:10px;font-size:10px;font-weight:bold;}
        
        /* 📊 NUEVAS STATS CON LEADS */
        .stats-bar { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 15px; }
        .stat-box { background: #111; padding: 15px; border-radius: 12px; border: 1px solid #222; text-align: center; }
        .stat-val { font-size: 1.2rem; font-weight: 800; color: #10b981; }
        .stat-lbl { font-size: 8px; color: #888; text-transform: uppercase; margin-top: 5px; }
        .lead-color { color: #8b5cf6; }

        .btn{width:100%;padding:14px;border-radius:10px;border:none;font-weight:800;cursor:pointer;margin-bottom:10px;font-size:13px;transition: 0.2s;}
        .btn-purple{background:#8b5cf6;color:#fff;}
        .btn-green{background:#10b981;color:#fff;}
        
        .panel{background:#0f0f1a;border-radius:15px;padding:15px;border:1px solid #1a1a2e; margin-bottom: 20px;}
        .panel-head { color:#c9a87b; font-size: 0.8rem; margin-bottom: 15px; font-weight: bold; text-transform: uppercase; border-bottom: 1px solid #222; padding-bottom: 10px; display: flex; justify-content: space-between; }
        
        /* LISTA DE LEADS (EL CONTROL) */
        .leads-container { max-height: 200px; overflow-y: auto; background: #000; border-radius: 10px; padding: 10px; }
        .lead-item { font-size: 11px; padding: 8px; border-bottom: 1px solid #111; display: flex; justify-content: space-between; color: #ccc; }
        .lead-date { color: #555; font-size: 9px; }

        .prod-row{background:#161625; border-radius: 12px; padding:15px; margin-bottom: 12px; border: 1px solid #222;}
        .metrics-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 5px; background: #000; padding: 10px; border-radius: 8px; margin-bottom: 10px; }
        .m-val { display: block; font-weight: bold; font-size: 12px; text-align: center;}
        .m-lbl { font-size: 8px; color: #666; text-transform: uppercase; text-align: center;}

        .modal{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.98);z-index:1000;padding:20px;overflow-y:auto;}
        .modal-box{background:#0f0f1a;padding:25px;border-radius:20px;border:1px solid #8b5cf6; max-width: 500px; margin: auto;}
        input, select{width:100%;padding:14px;margin:5px 0;background:#161625;border:1px solid #222;color:#fff;border-radius:10px;}
    </style>
</head>
<body>

<div class="header">
    <h1>🎖️ COMMANDER MXL <span class="v-badge">v11.0</span></h1>
</div>

<div class="stats-bar">
    <div class="stat-box"><div class="stat-val" id="totalProds">0</div><div class="stat-lbl">Productos</div></div>
    <div class="stat-box"><div class="stat-val" id="totalClicks">0</div><div class="stat-lbl">Clicks</div></div>
    <div class="stat-box"><div class="stat-val lead-color" id="totalLeads">0</div><div class="stat-lbl">VIP Leads</div></div>
</div>

<button class="btn btn-purple" onclick="abrirModal()">💉 INYECTAR GANADOR</button>

<!-- 📧 SECCIÓN DE CONTROL DE EMAILS -->
<div class="panel">
    <div class="panel-head">📩 VIP EMAIL CAPTURE (LEADS) <span>RECENT</span></div>
    <div class="leads-container" id="leadsList">
        <div style="text-align:center; padding: 20px; color: #444;">No emails captured yet.</div>
    </div>
</div>

<!-- 📦 SECCIÓN DE PRODUCTOS -->
<div class="panel">
    <div class="panel-head">📦 INVENTORY PERFORMANCE</div>
    <div id="prodList">Loading engine...</div>
</div>

<script>
    async function cargarTodo() {
        try {
            // Cargar Stats y Leads
            const stats = await fetch('/api/stats').then(r => r.json());
            document.getElementById('totalProds').innerText = stats.productos || 0;
            document.getElementById('totalClicks').innerText = stats.clicsHoy || 0;
            document.getElementById('totalLeads').innerText = stats.leadsVIP || 0;

            // Cargar Lista de Leads (Opcional: puedes crear un endpoint /api/leads si quieres ver la lista completa)
            // Por ahora mostramos los productos y las métricas
            const res = await fetch('/api/productos').then(r => r.json());
            const list = document.getElementById('prodList');
            
            list.innerHTML = (res.items || []).map(p => {
                const ctr = p.impresiones > 0 ? ((p.clics / p.impresiones) * 100).toFixed(2) : "0.00";
                return `
                <div class="prod-row">
                    <b>${p.titulo}</b>
                    <div class="metrics-grid">
                        <div class="m-item"><span class="m-val">$${p.precio}</span><span class="m-lbl">USD</span></div>
                        <div class="m-item"><span class="m-val">${p.impresiones}</span><span class="m-lbl">Views</span></div>
                        <div class="m-item"><span class="m-val" style="color:#10b981">${ctr}%</span><span class="m-lbl">CTR</span></div>
                    </div>
                    <button class="btn" style="background:#dc2626; padding:8px; font-size:10px;" onclick="eliminar(${p.id})">DELETE PRODUCT</button>
                </div>`;
            }).join('') || 'Empty inventory.';
        } catch(e) { console.error(e); }
    }

    // El resto de funciones (Inyectar, Eliminar, Modal) siguen igual que v10.0
    // Asegúrate de que el botón del Popup VIP en tu index.html llame a /api/subscribe
    cargarTodo();
</script>
</body>
</html>
