<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MXL SEO Admin | Railway Engine 8080</title>
    <style>
        :root { --gold: #b59410; --dark: #121212; --card: #1e1e1e; --text: #e0e0e0; --railway: #af4cff; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--dark); color: var(--text); padding: 15px; }
        .container { max-width: 600px; margin: 0 auto; background: var(--card); padding: 25px; border-radius: 12px; border: 1px solid #333; }
        .engine-status { display: flex; justify-content: space-between; background: #000; padding: 10px; border-radius: 6px; margin-bottom: 20px; border: 1px solid var(--railway); font-size: 11px; }
        .status-item { color: var(--railway); font-weight: bold; }
        h2 { color: var(--gold); text-align: center; text-transform: uppercase; font-size: 20px; }
        label { display: block; margin-top: 15px; font-weight: bold; color: var(--gold); font-size: 12px; }
        input, textarea { width: 100%; padding: 12px; margin-top: 5px; background: #2a2a2a; border: 1px solid #444; color: white; border-radius: 6px; }
        .btn-gen { width: 100%; padding: 15px; background: var(--gold); border: none; color: black; font-weight: 900; margin-top: 25px; cursor: pointer; text-transform: uppercase; border-radius: 6px; }
        #code-output { background: #000; padding: 15px; border: 1px dashed var(--gold); color: #00ff00; font-family: monospace; font-size: 11px; white-space: pre-wrap; margin-top: 20px; display: none; }
    </style>
</head>
<body>
<div class="container">
    <div class="engine-status">
        <div class="status-item">PORT: <span>8080</span></div>
        <div class="status-item">DB: <span>POSTGRES</span></div>
    </div>
    <h2>MXL SEO Publisher 🚀</h2>
    <label>Product Title</label>
    <input type="text" id="title" placeholder="Ej: Minimalist Ceramic Lamp">
    <label>Image URL</label>
    <input type="text" id="img" placeholder="https://m.media-amazon.com/images/I/...">
    <label>SEO Description (English)</label>
    <textarea id="seo_desc" rows="3"></textarea>
    <label>Affiliate Link</label>
    <input type="text" id="link" placeholder="https://amzn.to/your-link">
    <button class="btn-gen" onclick="generateSEO()">Generate SEO Block ✨</button>
    <div id="code-output"></div>
</div>
<script>
    function generateSEO() {
        const title = document.getElementById('title').value;
        const img = document.getElementById('img').value;
        const desc = document.getElementById('seo_desc').value;
        const link = document.getElementById('link').value;
        const html = `
        <article class="product-card">
            <div class="tag">TOP CHOICE</div>
            <img src="${img}" alt="${title}">
            <div class="stars">★★★★★</div>
            <h3>${title}</h3>
            <p>${desc}</p>
            <a href="${link}" target="_blank" class="btn-amazon">CHECK TODAY'S DEAL</a>
        </article>`;
        document.getElementById('code-output').innerText = html;
        document.getElementById('code-output').style.display = 'block';
    }
</script>
</body>
</html>
