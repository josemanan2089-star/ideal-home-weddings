<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>COMMANDER MXL - Panel de Control v4.2</title>
    <style>
        /* [Tus estilos se mantienen iguales para no romper el diseño] */
        *{margin:0;padding:0;box-sizing:border-box;}
        body{font-family:system-ui,sans-serif;background:#0f0f1a;color:#fff;padding:20px;}
        .header{background:linear-gradient(135deg,#1a1a2e,#2d2d44);padding:20px;border-radius:16px;margin-bottom:20px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;}
        h1{font-size:1.5rem;display:flex;align-items:center;gap:10px;}
        .commander-badge{background:#ff4500;padding:4px 12px;border-radius:20px;font-size:12px;font-weight:normal;}
        .stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:15px;margin-bottom:20px;}
        .stat-card{background:#1a1a2e;padding:20px;border-radius:12px;text-align:center;transition:transform 0.2s;}
        .stat-number{font-size:2rem;font-weight:bold;color:#ff4500;}
        .stat-label{font-size:0.7rem;color:#c9a87b;margin-top:5px;}
        .btn{background:#ff4500;color:#fff;border:none;padding:10px 20px;border-radius:8px;cursor:pointer;margin:5px;transition:all 0.3s;font-weight:bold;}
        .btn-commander{background:#8b5cf6;}
        .section{background:#1a1a2e;border-radius:12px;padding:20px;margin-top:20px;}
        .modal{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.9);align-items:center;justify-content:center;z-index:1000;}
        .modal-content{background:#1a1a2e;padding:30px;border-radius:16px;max-width:550px;width:90%;max-height:85vh;overflow-y:auto;}
        .modal-content input,.modal-content select{width:100%;padding:12px;margin:10px 0;border-radius:8px;border:none;background:#2d2d44;color:#fff;}
        label{display:block;margin-bottom:5px;font-size:12px;color:#c9a87b;}
        .toast{position:fixed;bottom:20px;right:20px;background:#10b981;color:#fff;padding:12px 20px;border-radius:8px;z-index:2000;}
        .badge{display:inline-block;padding:2px 8px;border-radius:12px;font-size:10px;margin-left:8px;background:#8b5cf6;}
    </style>
</head>
<body>
    <div class="header">
        <h1>🎖️ COMMANDER MXL <span class="commander-badge">mxl = Único Disparador</span></h1>
        <div>
            <button class="btn btn-commander" onclick="abrirModalInyeccion()">💉 INYECTAR PRODUCTO</button>
            <button class="btn" style="background:#2d2d44" onclick="cargarTodo()">🔄 Refrescar</button>
        </div>
    </div>

    <!-- Stats omitidas por brevedad pero se mantienen en tu código real -->
    <div id="stats" class="stats-grid"></div>

    <div class="section">
        <h3>📦 PRODUCTOS INYECTADOS <span class="badge">MOTOR 2.5</span></h3>
        <div id="productosList"></div>
    </div>

    <!-- MODAL DE INYECCIÓN ARREGLADO -->
    <div id="modalInyeccion" class="modal">
        <div class="modal-content">
            <h3>💉 INYECCIÓN MAESTRA - MOTOR 2.5</h3>
            <p style="font-size:12px; color:#c9a87b; margin-bottom:15px;">Dile a la IA qué es el producto para evitar errores.</p>
            
            <div class="form-group">
                <label>🏷️ NOMBRE REAL DEL PRODUCTO (Ej: Cama de Lujo, Horno Grill)</label>
                <input type="text" id="productoTituloReal" placeholder="Escribe qué es exactamente...">
            </div>
            
            <div class="form-group">
                <label>🔗 URL de Amazon</label>
                <input type="text" id="productoUrl" placeholder="https://amazon.com/...">
            </div>
            
            <div class="form-group">
                <label>🖼️ URL de Imagen</label>
                <input type="text" id="productoImagen" placeholder="https://...">
            </div>

            <div class="form-group">
                <label>📁 Categoría</label>
                <select id="productoCategoria">
                    <option value="LUXURY">LUXURY</option>
                    <option value="SMART HOME">SMART HOME</option>
                    <option value="KITCHEN">KITCHEN GOURMET</option>
                </select>
            </div>

            <button class="btn btn-commander" id="btnInyectar" onclick="inyectarProducto()" style="width:100%;">🚀 EJECUTAR INYECCIÓN 2.5</button>
            <button class="btn" style="width:100%; background:#2d2d44;" onclick="cerrarModal()">Cerrar</button>
        </div>
    </div>

    <script>
        function mostrarToast(m) { const t=document.createElement('div'); t.className='toast'; t.textContent=m; document.body.appendChild(t); setTimeout(()=>t.remove(),3000); }
        
        function abrirModalInyeccion() { document.getElementById('modalInyeccion').style.display='flex'; }
        function cerrarModal() { document.getElementById('modalInyeccion').style.display='none'; }

        async function inyectarProducto() {
            const titulo = document.getElementById('productoTituloReal').value;
            const url = document.getElementById('productoUrl').value;
            const img = document.getElementById('productoImagen').value;
            const cat = document.getElementById('productoCategoria').value;

            if(!titulo || !url) return mostrarToast("❌ Falta el Nombre o Link");

            const btn = document.getElementById('btnInyectar');
            btn.disabled = true; btn.textContent = "⌛ INYECTANDO...";

            try {
                const res = await fetch('/api/commander/inject', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ url, imagenUrl: img, categoria: cat, tituloReal: titulo })
                });
                const data = await res.json();
                if(data.success) {
                    mostrarToast("✅ ¡Producto Inyectado con Éxito!");
                    cerrarModal();
                    cargarTodo();
                }
            } catch(e) { mostrarToast("❌ Error en el servidor"); }
            finally { btn.disabled = false; btn.textContent = "🚀 EJECUTAR INYECCIÓN 2.5"; }
        }

        async function cargarTodo() {
            const res = await fetch('/api/productos');
            const prods = await res.json();
            document.getElementById('productosList').innerHTML = prods.map(p => `
                <div style="padding:10px; border-bottom:1px solid #2d2d44; display:flex; justify-content:space-between;">
                    <span>${p.titulo}</span>
                    <small>${p.categoria}</small>
                </div>
            `).join('');
        }
        cargarTodo();
    </script>
</body>
</html>
