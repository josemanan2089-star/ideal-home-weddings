<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel MXL | Publicar Artículo + Curiosidades</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #f7ede8 0%, #fff5f0 100%);
            min-height: 100vh;
            padding: 40px 20px;
        }
        .container { max-width: 800px; margin: 0 auto; }
        .card {
            background: white;
            border-radius: 28px;
            padding: 35px;
            margin-bottom: 25px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.08);
        }
        h2 { font-size: 1.5rem; margin-bottom: 10px; color: #2c2418; }
        .sub { color: #8b7355; margin-bottom: 25px; font-size: 0.9rem; }
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; font-weight: 600; color: #4a3727; }
        input, select {
            width: 100%;
            padding: 14px;
            border: 2px solid #f0e2d8;
            border-radius: 16px;
            font-size: 14px;
        }
        input:focus { border-color: #ff4500; outline: none; }
        button {
            background: #ff4500;
            color: white;
            border: none;
            padding: 14px 24px;
            border-radius: 40px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            transition: all 0.3s;
        }
        button:hover { background: #e03e00; transform: translateY(-2px); }
        .btn-secondary { background: #c9a87b; margin-top: 10px; }
        .btn-secondary:hover { background: #b89464; }
        .status {
            margin-top: 15px;
            padding: 12px;
            border-radius: 12px;
            display: none;
            text-align: center;
        }
        .success { background: #e8f5e9; color: #2e7d32; display: block; }
        .error { background: #ffebee; color: #c62828; display: block; }
        .info { background: #e3f2fd; color: #1565c0; display: block; }
        .preview-img {
            margin-top: 15px;
            text-align: center;
        }
        .preview-img img {
            max-width: 100%;
            max-height: 200px;
            border-radius: 12px;
            border: 2px solid #f0e2d8;
        }
        hr { margin: 25px 0; border: none; border-top: 2px solid #f0e2d8; }
    </style>
</head>
<body>
    <div class="container">
        <!-- Publicar Artículo (TÚ pones la imagen) -->
        <div class="card">
            <h2>📰 Publicar Artículo</h2>
            <div class="sub">Gemini escribe el artículo. TÚ pones la imagen del producto</div>
            
            <div class="form-group">
                <label>🔗 Link de Amazon</label>
                <input type="text" id="amazonUrl" placeholder="https://amazon.com/dp/XXXXXXXXXX">
            </div>
            
            <div class="form-group">
                <label>🖼️ URL de la Imagen del Producto</label>
                <input type="text" id="imagenUrl" placeholder="Pega aquí la URL de la imagen real del producto">
                <div class="preview-img" id="previewImgContainer" style="display: none;">
                    <img id="previewImg" src="" alt="Vista previa">
                </div>
            </div>
            
            <div class="form-group">
                <label>📂 Categoría</label>
                <select id="categoria">
                    <option value="kitchen">Kitchen</option>
                    <option value="smart-home">Smart Home</option>
                    <option value="lifestyle">Lifestyle</option>
                    <option value="wedding">Wedding Registry</option>
                </select>
            </div>
            
            <button onclick="publicarArticulo()">✨ PUBLICAR ARTÍCULO CON GEMINI</button>
            <div id="statusArticulo" class="status"></div>
        </div>
        
        <!-- Generar Curiosidad (Gemini escribe + busca imagen) -->
        <div class="card">
            <h2>💎 Generar Curiosidad Viral</h2>
            <div class="sub">Gemini escribe la curiosidad y busca una imagen impactante</div>
            <button class="btn-secondary" onclick="generarCuriosidad()">🌸 GENERAR NUEVA CURIOSIDAD</button>
            <div id="statusCuriosidad" class="status"></div>
        </div>
        
        <!-- Estadísticas -->
        <div class="card">
            <h2>📊 Estadísticas</h2>
            <div id="stats">
                <p>Cargando...</p>
            </div>
        </div>
    </div>
    
    <script>
        // Vista previa de imagen
        document.getElementById('imagenUrl').addEventListener('input', function(e) {
            const preview = document.getElementById('previewImgContainer');
            const img = document.getElementById('previewImg');
            if (e.target.value) {
                preview.style.display = 'block';
                img.src = e.target.value;
            } else {
                preview.style.display = 'none';
            }
        });
        
        async function publicarArticulo() {
            const url = document.getElementById('amazonUrl').value;
            const imagenUrl = document.getElementById('imagenUrl').value;
            const categoria = document.getElementById('categoria').value;
            
            if (!url) {
                mostrarStatus('statusArticulo', '❌ Ingresa un link de Amazon', 'error');
                return;
            }
            
            mostrarStatus('statusArticulo', '🤖 Gemini está escribiendo el artículo...', 'info');
            
            try {
                const res = await fetch('/api/publicar-articulo', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ url, imagenUrl, categoria })
                });
                
                const data = await res.json();
                if (data.success) {
                    mostrarStatus('statusArticulo', `✅ Artículo publicado: "${data.articulo.titulo}"`, 'success');
                    document.getElementById('amazonUrl').value = '';
                    cargarStats();
                } else {
                    mostrarStatus('statusArticulo', '❌ Error: ' + data.error, 'error');
                }
            } catch (e) {
                mostrarStatus('statusArticulo', '❌ Error de conexión', 'error');
            }
        }
        
        async function generarCuriosidad() {
            mostrarStatus('statusCuriosidad', '✨ Gemini está creando una curiosidad viral...', 'info');
            
            try {
                const res = await fetch('/api/generar-curiosidad', { method: 'POST' });
                const data = await res.json();
                if (data.success) {
                    mostrarStatus('statusCuriosidad', `✅ "${data.curiosidad.titulo}"`, 'success');
                    cargarStats();
                } else {
                    mostrarStatus('statusCuriosidad', '❌ Error al generar', 'error');
                }
            } catch (e) {
                mostrarStatus('statusCuriosidad', '❌ Error de conexión', 'error');
            }
        }
        
        async function cargarStats() {
            try {
                const [resArt, resCur] = await Promise.all([
                    fetch('/api/articulos'),
                    fetch('/api/curiosidades')
                ]);
                
                const articulos = await resArt.json();
                const curiosidades = await resCur.json();
                const totalClicks = articulos.reduce((sum, a) => sum + (a.clicks || 0), 0);
                
                document.getElementById('stats').innerHTML = `
                    <p>📰 Artículos: ${articulos.length}</p>
                    <p>👆 Clicks totales: ${totalClicks}</p>
                    <p>💎 Curiosidades: ${curiosidades.length}</p>
                    <p>✨ Última curiosidad: ${curiosidades[0]?.titulo || 'Ninguna'}</p>
                `;
            } catch (e) {
                console.error('Error stats:', e);
            }
        }
        
        function mostrarStatus(elementId, msg, tipo) {
            const status = document.getElementById(elementId);
            status.textContent = msg;
            status.className = `status ${tipo}`;
            setTimeout(() => {
                status.className = 'status';
            }, 4000);
        }
        
        cargarStats();
        setInterval(cargarStats, 30000);
    </script>
</body>
</html>
