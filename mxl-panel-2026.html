<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel | Publicar Curiosidad</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background: linear-gradient(135deg, #f5e6d3, #ffe6d5);
            min-height: 100vh;
            padding: 40px 20px;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
        }
        .card {
            background: white;
            border-radius: 24px;
            padding: 40px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
        }
        h1 {
            font-size: 1.8rem;
            margin-bottom: 10px;
            color: #2c1810;
        }
        .sub {
            color: #8b6b4d;
            margin-bottom: 30px;
        }
        input, textarea {
            width: 100%;
            padding: 14px;
            border: 2px solid #f0e4d8;
            border-radius: 12px;
            margin-bottom: 20px;
            font-size: 14px;
            transition: all 0.3s;
        }
        input:focus, textarea:focus {
            border-color: #c9a87b;
            outline: none;
        }
        button {
            background: #2c1810;
            color: white;
            border: none;
            padding: 16px;
            width: 100%;
            border-radius: 40px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
        }
        button:hover {
            background: #c9a87b;
            transform: translateY(-2px);
        }
        .status {
            margin-top: 20px;
            padding: 12px;
            border-radius: 12px;
            display: none;
            text-align: center;
        }
        .success {
            background: #e8f5e9;
            color: #2e7d32;
            display: block;
        }
        .error {
            background: #ffebee;
            color: #c62828;
            display: block;
        }
        .info {
            background: #e3f2fd;
            color: #1565c0;
            display: block;
        }
        .stats {
            margin-top: 30px;
            padding: 20px;
            background: #f9f0e8;
            border-radius: 16px;
        }
        hr {
            margin: 20px 0;
            border: none;
            border-top: 1px solid #f0e4d8;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <h1>✨ Publicar Curiosidad</h1>
            <p class="sub">Gemini generará un secreto irresistible para mujeres</p>
            
            <input type="text" id="amazonUrl" placeholder="Link de Amazon (ej: https://amazon.com/dp/XXXXXX)">
            <input type="text" id="imagenUrl" placeholder="URL de imagen (opcional)">
            
            <button onclick="publicarCuriosidad()">🌸 GENERAR CURIOSIDAD CON GEMINI</button>
            
            <div id="status" class="status"></div>
            
            <hr>
            
            <div class="stats" id="stats">
                <strong>📊 Estadísticas</strong>
                <p>Cargando...</p>
            </div>
        </div>
    </div>
    
    <script>
        async function publicarCuriosidad() {
            const url = document.getElementById('amazonUrl').value;
            if (!url) {
                mostrarStatus('❌ Ingresa un link de Amazon', 'error');
                return;
            }
            
            mostrarStatus('🤖 Gemini está generando una curiosidad exclusiva...', 'info');
            
            try {
                const res = await fetch('/api/publicar-curiosidad', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        url: url,
                        imagenUrl: document.getElementById('imagenUrl').value
                    })
                });
                
                const data = await res.json();
                if (data.success) {
                    mostrarStatus('✅ ¡Curiosidad publicada! Las mujeres ya pueden verla', 'success');
                    document.getElementById('amazonUrl').value = '';
                    cargarStats();
                } else {
                    mostrarStatus('❌ Error: ' + data.error, 'error');
                }
            } catch (e) {
                mostrarStatus('❌ Error de conexión', 'error');
            }
        }
        
        async function cargarStats() {
            try {
                const res = await fetch('/api/articulos');
                const articulos = await res.json();
                const totalClicks = articulos.reduce((sum, a) => sum + (a.clicks || 0), 0);
                
                document.getElementById('stats').innerHTML = `
                    <strong>📊 Estadísticas</strong>
                    <p>📰 Artículos publicados: ${articulos.length}</p>
                    <p>👆 Clicks totales: ${totalClicks}</p>
                    <p>✨ Último artículo: ${articulos[0]?.fecha ? new Date(articulos[0].fecha).toLocaleDateString() : 'Ninguno'}</p>
                    <p>🤖 Auto-publicación: CADA 3 HORAS</p>
                `;
            } catch (e) {
                console.error('Error stats:', e);
            }
        }
        
        function mostrarStatus(msg, tipo) {
            const status = document.getElementById('status');
            status.textContent = msg;
            status.className = `status ${tipo}`;
            setTimeout(() => {
                status.className = 'status';
            }, 4000);
        }
        
        cargarStats();
        setInterval(cargarStats, 30000);
    </script>
</body>
</html>
