<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MXL GOLD MINER | Panel de Control Total</title>
    <style>
        :root { --orange: #ff4500; --dark: #0a0a0a; --gold: #b59410; --card: #161616; --blue: #007bff; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--dark); color: #fff; padding: 15px; margin: 0; }
        .container { max-width: 700px; margin: 0 auto; }
        .header { border-bottom: 3px solid var(--orange); padding: 10px 0; margin-bottom: 20px; text-align: center; }
        
        /* TABS */
        .tabs { display: flex; gap: 5px; margin-bottom: 20px; }
        .tab-btn { flex: 1; padding: 12px; background: #222; border: none; color: #888; cursor: pointer; font-weight: bold; text-transform: uppercase; font-size: 11px; }
        .tab-btn.active { background: var(--orange); color: #fff; }

        .panel-box { background: var(--card); padding: 20px; border-radius: 12px; border: 1px solid #333; margin-bottom: 20px; display: none; }
        .panel-box.active { display: block; }

        label { display: block; font-size: 11px; color: var(--gold); text-transform: uppercase; margin-top: 15px; font-weight: bold; }
        input, textarea, select { width: 100%; background: #222; border: 1px solid #444; color: white; padding: 12px; border-radius: 6px; margin-top: 5px; font-size: 14px; }
        
        .strategy-btns { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; margin-top: 10px; }
        .s-btn { background: #333; border: 1px solid #555; color: #fff; font-size: 10px; padding: 8px; cursor: pointer; border-radius: 4px; }
        .s-btn:hover { background: var(--gold); color: #000; }

        .btn-main { background: var(--orange); color: white; border: none; width: 100%; padding: 18px; font-weight: 900; text-transform: uppercase; cursor: pointer; margin-top: 25px; border-radius: 8px; letter-spacing: 1px; }
        
        #final-code { background: #000; border: 1px dashed var(--gold); color: #00ff00; padding: 15px; font-family: monospace; font-size: 11px; margin-top: 20px; display: none; white-space: pre-wrap; position: relative; }
        .copy-btn { position: absolute; top: 5px; right: 5px; background: var(--gold); border: none; font-size: 10px; padding: 5px; cursor: pointer; border-radius: 3px; }
        
        .legal-info { font-size: 11px; color: #666; margin-top: 10px; font-style: italic; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1 style="font-size: 20px;">🏮 MXL <span>GOLD MINER</span> 8080</h1>
        <p style="font-size: 10px; color: var(--gold); letter-spacing: 2px;">ADSENSE & LEGAL COMPLIANCE SYSTEM</p>
    </div>

    <div class="tabs">
        <button class="tab-btn active" onclick="showTab('tab-publisher')">Publisher</button>
        <button class="tab-btn" onclick="showTab('tab-ads')">Ads & El Farol</button>
        <button class="tab-btn" onclick="showTab('tab-legal')">Legal & Cookies</button>
    </div>

    <!-- TAB 1: PUBLISHER -->
    <div id="tab-publisher" class="panel-box active">
        <label>1. URL DE IMAGEN (AMAZON)</label>
        <input type="text" id="img" placeholder="Pegar link de imagen aquí...">

        <label>2. LINK DE AFILIADO (AMZN.TO)</label>
        <input type="text" id="link" placeholder="Pegar tu link de socio...">

        <label>3. TÍTULO DEL PRODUCTO (BILINGÜE)</label>
        <div style="display:grid; grid-template-columns: 1fr 1fr; gap:10px;">
            <input type="text" id="tEn" placeholder="Title (EN)">
            <input type="text" id="tEs" placeholder="Título (ES)">
        </div>

        <label>4. ESTRATEGIA DE VENTA</label>
        <div class="strategy-btns">
            <button class="s-btn" onclick="setCopy('viral')">✨ TIKTOK VIRAL</button>
            <button class="s-btn" onclick="setCopy('luxury')">💎 LUXURY STYLE</button>
            <button class="s-btn" onclick="setCopy('urgent')">🔥 URGENT SALE</button>
        </div>

        <div style="display:grid; grid-template-columns: 1fr 1fr; gap:10px; margin-top:10px;">
            <textarea id="dEn" rows="3" placeholder="English Description"></textarea>
            <textarea id="dEs" rows="3" placeholder="Descripción Español"></textarea>
        </div>

        <button class="btn-main" onclick="build()">🚀 GENERAR BLOQUE PRODUCTO</button>
    </div>

    <!-- TAB 2: ADS & EL FAROL -->
    <div id="tab-ads" class="panel-box">
        <label>AdSense Publisher ID</label>
        <input type="text" id="pub-id" value="pub-5280872495839888">
        
        <label>El Farol Ads - Veneno SEO (Copy)</label>
        <textarea id="ad-copy" rows="2" placeholder="Escribe el gancho de venta para el banner..."></textarea>
        
        <label>Ubicación del Banner</label>
        <select id="ad-pos">
            <option value="sidebar">Sidebar (Lateral)</option>
            <option value="top">Header (Superior)</option>
            <option value="footer">Footer (Inferior)</option>
        </select>
        
        <button class="btn-main" style="background: var(--blue);" onclick="buildAd()">➕ GENERAR CÓDIGO ADS / FAROL</button>
    </div>

    <!-- TAB 3: LEGAL & COOKIES -->
    <div id="tab-legal" class="panel-box">
        <label>Página de Privacidad (USA/RD Standard)</label>
        <textarea id="legal-priv" rows="4">Esta política de privacidad describe cómo recopilamos y usamos la información. Cumplimos con las normativas de Amazon Associates y Google AdSense...</textarea>
        
        <label>Términos y Condiciones</label>
        <textarea id="legal-terms" rows="2">Al usar este sitio, aceptas nuestros términos de servicio. Ideal Home & Weddings es un afiliado de Amazon...</textarea>
        
        <label>Mensaje de Cookies (Banner)</label>
        <input type="text" id="cookie-msg" value="Utilizamos cookies para mejorar tu experiencia. Al navegar aceptas nuestra política.">
        
        <div class="legal-info">Estos parámetros son obligatorios para que AdSense apruebe elfarolaldia.com y este nuevo proyecto.</div>
        <button class="btn-main" style="background: #444;" onclick="alert('Copia los textos y pégalos en tus archivos legales (privacidad.html, cookies.html)')">VERIFICAR TEXTOS LEGALES</button>
    </div>

    <div id="final-code">
        <button class="copy-btn" onclick="copyCode()">COPY</button>
        <code id="code-content"></code>
    </div>
</div>

<script>
    function showTab(tabId) {
        document.querySelectorAll('.panel-box').forEach(b => b.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.getElementById(tabId).classList.add('active');
        event.currentTarget.classList.add('active');
    }

    function setCopy(type) {
        const dEn = document.getElementById('dEn');
        const dEs = document.getElementById('dEs');
        if(type === 'viral') {
            dEn.value = "TikTok made me buy it! This 2026 must-have is viral for a reason. Limited stock.";
            dEs.value = "¡TikTok me hizo comprarlo! Este producto viral de 2026 es tendencia por una razón. Stock limitado.";
        } else if(type === 'luxury') {
            dEn.value = "Elevate your home with quiet luxury. Sophisticated design for premium interiors.";
            dEs.value = "Eleva tu hogar con lujo silencioso. Diseño sofisticado para interiores de alto nivel.";
        } else if(type === 'urgent') {
            dEn.value = "FLASH DEAL! Top rated registry essential. Only a few units left at this price.";
            dEs.value = "¡OFERTA RELÁMPAGO! Esencial de bodas mejor calificado. Pocas unidades a este precio.";
        }
    }

    function build() {
        const code = `
<article class="product-card" itemscope itemtype="https://schema.org/Product">
    <div class="tag-mxl">TOP RATED</div>
    <img src="${document.getElementById('img').value}" alt="${document.getElementById('tEn').value}" itemprop="image">
    <div class="lang-en">
        <h3 itemprop="name">${document.getElementById('tEn').value}</h3>
        <p style="font-size:12px; color:#666;">${document.getElementById('dEn').value}</p>
        <a href="${document.getElementById('link').value}" class="btn-amazon" rel="nofollow sponsored">CHECK TODAY'S DEAL</a>
    </div>
    <div class="lang-es" style="display:none;">
        <h3 itemprop="name">${document.getElementById('tEs').value}</h3>
        <p style="font-size:12px; color:#666;">${document.getElementById('dEs').value}</p>
        <a href="${document.getElementById('link').value}" class="btn-amazon" rel="nofollow sponsored">VER PRECIO EN AMAZON</a>
    </div>
</article>`;
        showCode(code);
    }

    function buildAd() {
        const pubId = document.getElementById('pub-id').value;
        const copy = document.getElementById('ad-copy').value;
        const pos = document.getElementById('ad-pos').value;
        const code = `
<!-- AD UNIT MXL: ${pos} -->
<div class="mxl-ad-card" data-pos="${pos}">
    <ins class="adsbygoogle" style="display:block" data-ad-client="ca-${pubId}" data-ad-slot="DYNAMIC" data-ad-format="auto"></ins>
    <p class="mxl-veneno">${copy}</p>
</div>`;
        showCode(code);
    }

    function showCode(code) {
        document.getElementById('code-content').innerText = code;
        document.getElementById('final-code').style.display = 'block';
        window.scrollTo(0, document.body.scrollHeight);
    }

    function copyCode() {
        navigator.clipboard.writeText(document.getElementById('code-content').innerText);
        alert("¡Copiado! Pégalo en tu index.html");
    }
</script>
</body>
</html>
