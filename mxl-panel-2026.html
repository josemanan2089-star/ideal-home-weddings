<!DOCTYPE html>
<html lang="en-US">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>COMMANDER MXL — Panel v10.0 | PROFIT MODE</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;}
        body{font-family:system-ui,sans-serif;background:#05050a;color:#fff;padding:15px;font-size:14px;}
        .header{background:linear-gradient(135deg,#1a1a2e,#000);padding:20px;border-radius:15px;margin-bottom:15px;border:1px solid #8b5cf6; text-align: center;}
        h1{font-size:1.3rem;margin-bottom:10px;color:#fff;letter-spacing:1px;}
        .v-badge{background:#8b5cf6;padding:3px 10px;border-radius:10px;font-size:10px;font-weight:bold;}
        
        .stats-bar { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 15px; }
        .stat-box { background: #111; padding: 15px; border-radius: 12px; border: 1px solid #222; text-align: center; }
        .stat-val { font-size: 1.5rem; font-weight: 800; color: #10b981; }
        .stat-lbl { font-size: 9px; color: #888; text-transform: uppercase; margin-top: 5px; }

        .btn{width:100%;padding:14px;border-radius:10px;border:none;font-weight:800;cursor:pointer;margin-bottom:10px;font-size:13px;transition: 0.2s;}
        .btn-purple{background:#8b5cf6;color:#fff; box-shadow: 0 4px 15px rgba(139, 92, 246, 0.3);}
        .btn-green{background:#10b981;color:#fff;}
        .btn-blue{background:#2563eb;color:#fff; flex: 1; padding: 8px;}
        .btn-red{background:#dc2626;color:#fff; flex: 1; padding: 8px;}
        
        .panel{background:#0f0f1a;border-radius:15px;padding:15px;border:1px solid #1a1a2e;}
        .panel-head{color:#c9a87b;font-size:0.8rem;margin-bottom:15px;font-weight:bold;text-transform:uppercase;letter-spacing:1px; border-bottom: 1px solid #222; padding-bottom: 10px;}
        
        .prod-row{background:#161625; border-radius: 12px; padding:15px; margin-bottom: 12px; border: 1px solid #222;}
        .prod-info b{color: #fff; font-size: 14px; display: block; margin-bottom: 8px;}
        
        .metrics-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 5px; background: #000; padding: 10px; border-radius: 8px; margin-bottom: 12px; }
        .m-item { text-align: center; }
        .m-val { display: block; font-weight: bold; font-size: 12px; }
        .m-lbl { font-size: 8px; color: #666; text-transform: uppercase; }
        .high-ctr { color: #10b981; }

        .actions{display: flex; gap: 8px;}
        
        .modal{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.98);z-index:1000;padding:20px;overflow-y:auto;}
        .modal-box{background:#0f0f1a;padding:25px;border-radius:20px;border:1px solid #8b5cf6; max-width: 500px; margin: auto;}
        label{font-size: 10px; color: #8b5cf6; text-transform: uppercase; display: block; margin-top: 12px; font-weight: bold;}
        input, select{width:100%;padding:14px;margin:5px 0;background:#161625;border:1px solid #222;color:#fff;border-radius:10px;font-size: 14px;}
        
        .tag-status { font-size: 10px; color: #888; margin-top: 10px; display: block; }
    </style>
</head>
<body>

<div class="header">
    <h1>🎖️ COMMANDER MXL <span class="v-badge">v10.0</span></h1>
    <span class="tag-status" id="tagAff">Tag: loading...</span>
</div>

<div class="stats-bar">
    <div class="stat-box">
        <div class="stat-val" id="totalProds">0</div>
        <div class="stat-lbl">Productos</div>
    </div>
    <div class="stat-box">
        <div class="stat-val" id="totalClicks">0</div>
        <div class="stat-lbl">Clicks Totales</div>
    </div>
</div>

<button class="btn btn-purple" onclick="abrirModalInyectar()">💉 INYECTAR PRODUCTO GANADOR</button>
<button class="btn btn-green" onclick="cargarTodo()">🔄 ACTUALIZAR MÉTRICAS</button>

<div class="panel">
    <div class="panel-head">📦 INVENTARIO E INTELIGENCIA (USA)</div>
    <div id="prodList">Analizando mercado...</div>
</div>

<!-- MODAL -->
<div id="modal" class="modal">
    <div class="modal-box">
        <h3 id="modalTitle" style="color: #fff; margin-bottom: 10px;">Inyectar Producto</h3>
        <input type="hidden" id="fId">
        
        <label>Título (Copy de Venta)</label>
        <input type="text" id="fTitle" placeholder="Ej: Smart Sleep Mask Premium">
        
        <label>💰 Precio Final USD</label>
        <input type="number" id="fPrice" step="0.01">
        
        <label>URL Amazon (Con tu Tag)</label>
        <input type="url" id="fUrl">
        
        <label>URL Imagen HD</label>
        <input type="url" id="fImg">

        <label>Categoría</label>
        <select id="fCat">
            <option value="LUXURY">LUXURY</option>
            <option value="SMART HOME">SMART HOME</option>
            <option value="TECH">TECH PREMIUM</option>
        </select>
        
        <div style="margin-top: 25px; display: flex; gap: 10px;">
            <button class="btn btn-purple" id="btnGuardar" onclick="guardar()">GUARDAR EN DB</button>
            <button class="btn" style="background:#222;" onclick="cerrarModal()">CANCELAR</button>
        </div>
    </div>
</div>

<script>
    let productosCache = [];

    async function cargarTodo() {
        try {
            // 1. Cargar Stats
            const stats = await fetch('/api/stats').then(r => r.json());
            document.getElementById('totalProds').innerText = stats.productos || 0;
            document.getElementById('totalClicks').innerText = stats.clicsHoy || 0;
            document.getElementById('tagAff').innerText = "Tag Activo: " + (stats.affiliateTag || "farolaldiauno-20");

            // 2. Cargar Productos
            const res = await fetch('/api/productos').then(r => r.json());
            productosCache = res.items || [];
            const list = document.getElementById('prodList');
            
            list.innerHTML = productosCache.map(p => {
                const ctr = p.impresiones > 0 ? ((p.clics / p.impresiones) * 100).toFixed(2) : "0.00";
                
                return `
                <div class="prod-row">
                    <div class="prod-info">
                        <b>${p.titulo}</b>
                        <div class="metrics-grid">
                            <div class="m-item">
                                <span class="m-val">$${p.precio}</span>
                                <span class="m-lbl">Precio</span>
                            </div>
                            <div class="m-item">
                                <span class="m-val">${p.impresiones || 0}</span>
                                <span class="m-lbl">Vistas</span>
                            </div>
                            <div class="m-item">
                                <span class="m-val ${parseFloat(ctr) > 5 ? 'high-ctr' : ''}">${ctr}%</span>
                                <span class="m-lbl">CTR</span>
                            </div>
                        </div>
                    </div>
                    <div class="actions">
                        <button class="btn btn-blue" onclick="prepararEdicion(${p.id})">📝 EDITAR</button>
                        <button class="btn btn-red" onclick="eliminar(${p.id})">🗑️ BORRAR</button>
                    </div>
                </div>
                `;
            }).join('') || 'No hay productos en la base de datos.';
        } catch(e) { 
            console.error(e);
            document.getElementById('prodList').innerText = "Error conectando con el servidor.";
        }
    }

    function abrirModalInyectar() {
        document.getElementById('modalTitle').innerText = "💉 Inyectar Nuevo";
        document.getElementById('fId').value = "";
        document.getElementById('fTitle').value = "";
        document.getElementById('fPrice').value = "";
        document.getElementById('fUrl').value = "";
        document.getElementById('fImg').value = "";
        document.getElementById('modal').style.display = 'block';
    }

    function prepararEdicion(id) {
        const p = productosCache.find(item => item.id == id);
        if(!p) return;
        document.getElementById('modalTitle').innerText = "📝 Editando";
        document.getElementById('fId').value = p.id;
        document.getElementById('fTitle').value = p.titulo;
        document.getElementById('fPrice').value = p.precio;
        document.getElementById('fUrl').value = p.link;
        document.getElementById('fImg').value = p.imagen;
        document.getElementById('fCat').value = p.categoria;
        document.getElementById('modal').style.display = 'block';
    }

    async function guardar() {
        const id = document.getElementById('fId').value;
        const payload = {
            tituloReal: document.getElementById('fTitle').value,
            url: document.getElementById('fUrl').value,
            precio: document.getElementById('fPrice').value,
            imagenUrl: document.getElementById('fImg').value,
            categoria: document.getElementById('fCat').value
        };

        const endpoint = id ? `/api/productos/${id}` : '/api/commander/inject';
        const method = id ? 'PUT' : 'POST';

        try {
            const res = await fetch(endpoint, {
                method: method,
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(payload)
            }).then(r => r.json());

            if(res.success) {
                cerrarModal();
                cargarTodo();
            } else { alert("Error: " + res.error); }
        } catch (e) { alert("Error de conexión"); }
    }

    async function eliminar(id) {
        if(confirm("¿Seguro que quieres borrar este producto, mxl?")) {
            await fetch(`/api/productos/${id}`, { method: 'DELETE' });
            cargarTodo();
        }
    }

    function cerrarModal() { document.getElementById('modal').style.display = 'none'; }
    
    // Iniciar carga
    cargarTodo();
</script>
</body>
</html>
