<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MXL SEO PUBLISHER | Redacción</title>
    <style>
        :root { --orange: #ff4500; --dark: #0f0f0f; --card: #1a1a1a; --gold: #b59410; }
        body { font-family: sans-serif; background: var(--dark); color: #eee; padding: 20px; }
        .container { max-width: 800px; margin: 0 auto; background: var(--card); padding: 30px; border-radius: 10px; border: 1px solid #333; }
        label { display: block; font-size: 12px; color: var(--gold); margin-top: 15px; text-transform: uppercase; }
        input, textarea { width: 100%; background: #222; border: 1px solid #444; color: white; padding: 12px; border-radius: 5px; margin-top: 5px; }
        .btn { width: 100%; padding: 15px; background: var(--orange); color: white; border: none; font-weight: bold; margin-top: 30px; cursor: pointer; text-transform: uppercase; }
        #output { background: #000; color: #00ff00; padding: 15px; font-family: monospace; font-size: 11px; margin-top: 20px; white-space: pre-wrap; display: none; border: 1px dashed var(--gold); }
    </style>
</head>
<body>
    <div class="container">
        <h2 style="color:var(--orange)">🏮 MXL SEO PUBLISHER PRO</h2>
        <label>URL Imagen Amazon</label>
        <input type="text" id="img">
        <label>Link Afiliado</label>
        <input type="text" id="link">
        
        <div style="display:grid; grid-template-columns: 1fr 1fr; gap: 20px;">
            <div>
                <label>Title (EN)</label><input type="text" id="tEn">
                <label>Desc (EN)</label><textarea id="dEn" rows="3"></textarea>
            </div>
            <div>
                <label>Título (ES)</label><input type="text" id="tEs">
                <label>Desc (ES)</label><textarea id="dEs" rows="3"></textarea>
            </div>
        </div>
        
        <button class="btn" onclick="gen()">GENERAR BLOQUE SEO BILINGÜE</button>
        <div id="output"></div>
    </div>

    <script>
        function gen() {
            const img = document.getElementById('img').value;
            const link = document.getElementById('link').value;
            const tEn = document.getElementById('tEn').value;
            const dEn = document.getElementById('dEn').value;
            const tEs = document.getElementById('tEs').value;
            const dEs = document.getElementById('dEs').value;

            const code = `
<!-- PRODUCT: ${tEn} -->
<article class="product-card" itemscope itemtype="https://schema.org/Product">
    <div class="tag-mxl">TOP RATED</div>
    <img src="${img}" alt="${tEn}" itemprop="image">
    <div class="lang-en">
        <h3 itemprop="name">${tEn}</h3>
        <p style="font-size:13px; color:#666; margin-top:10px;" itemprop="description">${dEn}</p>
        <a href="${link}" class="btn-amazon" itemprop="url">CHECK TODAY'S DEAL</a>
    </div>
    <div class="lang-es">
        <h3 itemprop="name">${tEs}</h3>
        <p style="font-size:13px; color:#666; margin-top:10px;" itemprop="description">${dEs}</p>
        <a href="${link}" class="btn-amazon" itemprop="url">VER PRECIO EN AMAZON</a>
    </div>
</article>`;
            document.getElementById('output').innerText = code;
            document.getElementById('output').style.display = 'block';
        }
    </script>
</body>
</html>
