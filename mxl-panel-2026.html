<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel MXL - Control de Ventas</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;}
        body{font-family:system-ui,sans-serif;background:#0f0f1a;color:#fff;padding:20px;}
        .header{background:linear-gradient(135deg,#1a1a2e,#2d2d44);padding:20px;border-radius:16px;margin-bottom:20px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;}
        h1{font-size:1.5rem;}
        .stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:15px;margin-bottom:20px;}
        .stat-card{background:#1a1a2e;padding:20px;border-radius:12px;text-align:center;}
        .stat-number{font-size:2rem;font-weight:bold;color:#ff4500;}
        .stat-label{font-size:0.7rem;color:#c9a87b;margin-top:5px;}
        .btn{background:#ff4500;color:#fff;border:none;padding:10px 20px;border-radius:8px;cursor:pointer;margin:5px;transition:all 0.3s;}
        .btn:hover{background:#ff6b35;transform:translateY(-2px);}
        .btn:disabled{opacity:0.5;cursor:not-allowed;transform:none;}
        .btn-danger{background:#dc2626;}
        .btn-danger:hover{background:#ef4444;}
        .btn-secondary{background:#2d2d44;}
        .btn-secondary:hover{background:#3d3d5c;}
        .btn-success{background:#10b981;}
        .btn-success:hover{background:#059669;}
        .section{background:#1a1a2e;border-radius:12px;padding:20px;margin-top:20px;}
        .section h3{margin-bottom:15px;color:#ff4500;}
        .curiosidad-item,.producto-item{border-bottom:1px solid #2d2d44;padding:15px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;}
        .curiosidad-item:last-child,.producto-item:last-child{border-bottom:none;}
        .curiosidad-titulo{flex:1;font-size:0.9rem;}
        .producto-titulo{flex:1;font-size:0.9rem;}
        .small-btn{background:#2d2d44;padding:5px 12px;border-radius:6px;font-size:12px;margin-left:10px;cursor:pointer;border:none;color:#fff;}
        .small-btn:hover{background:#ff4500;}
        .empty{text-align:center;padding:40px;color:#666;}
        .modal{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.8);align-items:center;justify-content:center;z-index:1000;}
        .modal-content{background:#1a1a2e;padding:30px;border-radius:16px;max-width:500px;width:90%;max-height:80vh;overflow-y:auto;}
        .modal-content input,.modal-content textarea{width:100%;padding:10px;margin:10px 0;border-radius:8px;border:none;background:#2d2d44;color:#fff;}
        .modal-content textarea{min-height:100px;font-family:monospace;}
        .form-group{margin-bottom:15px;}
        label{display:block;margin-bottom:5px;font-size:12px;color:#c9a87b;}
        select{width:100%;padding:10px;border-radius:8px;background:#2d2d44;color:#fff;border:none;cursor:pointer;}
        .copy-preview{background:#0f0f1a;padding:12px;border-radius:8px;font-size:12px;max-height:200px;overflow:auto;margin-top:10px;}
        .copy-preview strong{color:#ff4500;}
        hr{margin:10px 0;border-color:#2d2d44;}
        .toast{position:fixed;bottom:20px;right:20px;background:#10b981;color:#fff;padding:12px 20px;border-radius:8px;animation:slideIn 0.3s ease;z-index:2000;}
        .toast.error{background:#ef4444;}
        .motor-status{display:flex;gap:10px;margin-top:10px;justify-content:center;}
        .motor-badge{font-size:10px;padding:4px 8px;border-radius:12px;}
        .motor-content{background:#ff4500;color:#fff;}
        .motor-sales{background:#10b981;color:#fff;}
        @keyframes slideIn{
            from{transform:translateX(100%);opacity:0;}
            to{transform:translateX(0);opacity:1;}
        }
        @media(max-width:600px){.curiosidad-item,.producto-item{flex-direction:column;align-items:flex-start;gap:10px;}}
    </style>
</head>
<body>
    <div class="header">
        <h1>🏮 MXL GOLD MINER - PANEL DE CONTROL</h1>
        <div>
            <button class="btn" onclick="generarCuriosidad(this)">✨ Generar Curiosidad</button>
            <button class="btn" onclick="abrirModalProducto()">📦 Nuevo Producto</button>
            <button class="btn btn-danger" onclick="borrarTodasCuriosidades()">🗑️ Borrar Todo</button>
            <button class="btn btn-secondary" onclick="cargarStats()">🔄 Refrescar</button>
        </div>
    </div>

    <div class="stats-grid" id="statsGrid">
        <div class="stat-card">
            🤖 CONTENT<br>
            <span id="contentStatus" class="stat-number">-</span>
            <div class="stat-label" id="contentModel">-</div>
        </div>
        <div class="stat-card">
            💰 SALES<br>
            <span id="salesStatus" class="stat-number">-</span>
            <div class="stat-label" id="salesModel">-</div>
        </div>
        <div class="stat-card">
            🎯 Ángulo<br>
            <span id="anguloStatus" class="stat-number">-</span>
            <div class="stat-label" id="anguloDesc">-</div>
        </div>
        <div class="stat-card">
            💎 Curiosidades<br>
            <span id="curiosidadesCount" class="stat-number">0</span>
            <div class="stat-label">generadas</div>
        </div>
        <div class="stat-card">
            🛍️ Productos<br>
            <span id="productosCount" class="stat-number">0</span>
            <div class="stat-label">publicados</div>
        </div>
        <div class="stat-card">
            🖱️ Clics<br>
            <span id="clicsCount" class="stat-number">0</span>
            <div class="stat-label">totales</div>
        </div>
    </div>

    <div class="section">
        <h3>📰 CURIOSIDADES RECIENTES <span style="font-size:10px;background:#ff4500;padding:2px 8px;border-radius:12px;">MOTOR CONTENT</span></h3>
        <div id="curiosidadesList"></div>
    </div>

    <div class="section">
        <h3>🛍️ PRODUCTOS PUBLICADOS <span style="font-size:10px;background:#10b981;padding:2px 8px;border-radius:12px;">MOTOR SALES</span></h3>
        <div id="productosList"></div>
    </div>

    <!-- Modal para nuevo producto -->
    <div id="modalProducto" class="modal">
        <div class="modal-content">
            <h3>📦 Nuevo Producto Exclusivo</h3>
            <div class="form-group">
                <label>URL de Amazon *</label>
                <input type="text" id="productoUrl" placeholder="https://www.amazon.com/dp/XXXXXXXXXX">
            </div>
            <div class="form-group">
                <label>URL de Imagen *</label>
                <input type="text" id="productoImagen" placeholder="https://...">
            </div>
            <div class="form-group">
                <label>Categoría</label>
                <select id="productoCategoria">
                    <option value="LUXURY">LUXURY</option>
                    <option value="SMART HOME">SMART HOME</option>
                    <option value="WELLNESS">WELLNESS</option>
                    <option value="DECOR">DECOR</option>
                </select>
            </div>
            <div class="form-group">
                <label>Tamaño de imagen</label>
                <select id="productoImageSize">
                    <option value="small">Pequeña</option>
                    <option value="medium" selected>Mediana</option>
                    <option value="large">Grande</option>
                </select>
            </div>
            <div class="form-group">
                <label>Posición de imagen</label>
                <select id="productoImagePosition">
                    <option value="left">Izquierda</option>
                    <option value="center" selected>Centro</option>
                    <option value="right">Derecha</option>
                </select>
            </div>
            <button class="btn" onclick="generarCopy()" id="btnGenerarCopy">💰 Generar Copy con SALES</button>
            <div id="copyPreview" style="margin-top:15px;display:none;">
                <hr>
                <h4>Vista previa del copy (generado por SALES):</h4>
                <div id="copyContent" class="copy-preview"></div>
                <button class="btn" onclick="publicarProducto()" style="margin-top:10px;width:100%;">📢 PUBLICAR PRODUCTO</button>
            </div>
            <button class="btn btn-secondary" onclick="cerrarModal()" style="margin-top:10px;width:100%;">Cerrar</button>
        </div>
    </div>

    <script>
        let copyGenerado = null;
        
        function mostrarToast(mensaje, esError = false) {
            const toast = document.createElement('div');
            toast.className = `toast ${esError ? 'error' : ''}`;
            toast.textContent = mensaje;
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 3000);
        }
        
        async function cargarStats() {
            try {
                const [stats, curiosidades, articulos, motores] = await Promise.all([
                    fetch('/api/estadisticas').then(r=>r.json()),
                    fetch('/api/curiosidades').then(r=>r.json()),
                    fetch('/api/articulos').then(r=>r.json()),
                    fetch('/api/motores-status').then(r=>r.json()).catch(() => null)
                ]);
                
                // Mostrar estado de motores
                if (motores) {
                    document.getElementById('contentStatus').textContent = motores.content?.disponible ? '✅' : '⚠️';
                    document.getElementById('contentModel').textContent = motores.content?.modelo || 'no disponible';
                    document.getElementById('salesStatus').textContent = motores.sales?.disponible ? '✅' : '⚠️';
                    document.getElementById('salesModel').textContent = motores.sales?.modelo || 'no disponible';
                } else {
                    // Fallback si el endpoint no existe
                    document.getElementById('contentStatus').textContent = stats.contentDisponible ? '✅' : '⚠️';
                    document.getElementById('contentModel').textContent = stats.contentModelo || '?';
                    document.getElementById('salesStatus').textContent = stats.salesDisponible ? '✅' : '⚠️';
                    document.getElementById('salesModel').textContent = stats.salesModelo || '?';
                }
                
                document.getElementById('anguloStatus').textContent = stats.anguloActual || '-';
                document.getElementById('anguloDesc').textContent = stats.descripcionAngulo || '';
                document.getElementById('curiosidadesCount').textContent = curiosidades.length;
                document.getElementById('productosCount').textContent = articulos.length;
                document.getElementById('clicsCount').textContent = stats.totalClics || 0;
                
                renderCuriosidades(curiosidades);
                renderProductos(articulos);
            } catch(e) {
                console.error('Error cargando stats:', e);
                mostrarToast('Error al cargar estadísticas', true);
            }
        }
        
        function renderCuriosidades(curiosidades) {
            const container = document.getElementById('curiosidadesList');
            if (!curiosidades || curiosidades.length === 0) {
                container.innerHTML = '<div class="empty">✨ No hay curiosidades aún. Genera la primera con CONTENT.</div>';
                return;
            }
            
            container.innerHTML = curiosidades.slice(0, 10).map(cur => `
                <div class="curiosidad-item">
                    <div class="curiosidad-titulo">
                        <strong>${escapeHtml(cur.titulo_es || cur.titulo_en || 'Sin título')}</strong><br>
                        <small style="color:#c9a87b">📅 ${new Date(cur.fecha).toLocaleString()} | 🎯 Ángulo: ${cur.anguloUsado || 'A'} | 🏭 Motor: CONTENT</small>
                    </div>
                    <div>
                        <button class="small-btn" onclick="borrarCuriosidad(${cur.id})">🗑️</button>
                    </div>
                </div>
            `).join('');
        }
        
        function renderProductos(productos) {
            const container = document.getElementById('productosList');
            if (!productos || productos.length === 0) {
                container.innerHTML = '<div class="empty">💰 No hay productos aún. Publica tu primer producto con SALES.</div>';
                return;
            }
            
            container.innerHTML = productos.map(prod => `
                <div class="producto-item">
                    <div class="producto-titulo">
                        <strong>${escapeHtml(prod.titulo || 'Sin título')}</strong><br>
                        <small style="color:#c9a87b">📁 ${prod.categoria} | 🖱️ ${prod.clicks || 0} clics | 📅 ${new Date(prod.fecha).toLocaleDateString()} | 💰 Motor: SALES</small>
                    </div>
                    <div>
                        <button class="small-btn" onclick="window.open('${prod.link}', '_blank')">🔗</button>
                    </div>
                </div>
            `).join('');
        }
        
        function escapeHtml(str) {
            if (!str) return '';
            return str.replace(/[&<>]/g, function(m) {
                if (m === '&') return '&amp;';
                if (m === '<') return '&lt;';
                if (m === '>') return '&gt;';
                return m;
            });
        }
        
        async function generarCuriosidad(btn) {
            if (!btn) btn = event.target;
            const originalText = btn.textContent;
            btn.textContent = '⏳ CONTENT generando...';
            btn.disabled = true;
            
            try {
                const res = await fetch('/api/generar-curiosidad', { method: 'POST' });
                const data = await res.json();
                if (data.success) {
                    mostrarToast(`✅ Curiosidad generada por MOTOR CONTENT (${data.motor || 'CONTENT'})`);
                    cargarStats();
                } else {
                    mostrarToast('❌ Error: ' + (data.error || 'Error desconocido'), true);
                }
            } catch(e) {
                console.error('Error:', e);
                mostrarToast('❌ Error al generar curiosidad', true);
            } finally {
                btn.textContent = originalText;
                btn.disabled = false;
            }
        }
        
        async function borrarCuriosidad(id) {
            if (!confirm('¿Eliminar esta curiosidad?')) return;
            try {
                const res = await fetch(`/api/curiosidad/${id}`, { method: 'DELETE' });
                if (res.ok) {
                    mostrarToast('✅ Curiosidad eliminada');
                    cargarStats();
                } else {
                    mostrarToast('❌ Error al eliminar', true);
                }
            } catch(e) {
                mostrarToast('Error: ' + e.message, true);
            }
        }
        
        async function borrarTodasCuriosidades() {
            if (!confirm('⚠️ ¿ELIMINAR TODAS LAS CURIOSIDADES? Esta acción no se puede deshacer.')) return;
            try {
                const res = await fetch('/api/curiosidades/all', { method: 'DELETE' });
                if (res.ok) {
                    mostrarToast('✅ Todas las curiosidades eliminadas');
                    cargarStats();
                } else {
                    mostrarToast('❌ Error al eliminar', true);
                }
            } catch(e) {
                mostrarToast('Error: ' + e.message, true);
            }
        }
        
        function abrirModalProducto() {
            document.getElementById('modalProducto').style.display = 'flex';
            copyGenerado = null;
            document.getElementById('copyPreview').style.display = 'none';
            document.getElementById('productoUrl').value = '';
            document.getElementById('productoImagen').value = '';
            document.getElementById('productoCategoria').value = 'LUXURY';
            document.getElementById('productoImageSize').value = 'medium';
            document.getElementById('productoImagePosition').value = 'center';
        }
        
        function cerrarModal() {
            document.getElementById('modalProducto').style.display = 'none';
        }
        
        async function generarCopy() {
            const url = document.getElementById('productoUrl').value.trim();
            const imagen = document.getElementById('productoImagen').value.trim();
            const categoria = document.getElementById('productoCategoria').value;
            
            if (!url || !imagen) {
                mostrarToast('❌ URL de Amazon y URL de imagen son obligatorias', true);
                return;
            }
            
            const btn = document.getElementById('btnGenerarCopy');
            const originalText = btn.textContent;
            btn.textContent = '💰 SALES generando copy...';
            btn.disabled = true;
            
            try {
                const res = await fetch('/api/generar-copy-producto', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ url, imagenUrl: imagen, categoria })
                });
                const data = await res.json();
                if (data.success && data.copy) {
                    copyGenerado = data.copy;
                    document.getElementById('copyContent').innerHTML = `
                        <strong>📝 Título:</strong> ${escapeHtml(copyGenerado.titulo || 'N/A')}<br>
                        <strong>📖 Intro:</strong> ${escapeHtml(copyGenerado.intro || 'N/A')}<br>
                        <strong>✨ Curiosidad:</strong> ${escapeHtml(copyGenerado.curiosidad || 'N/A')}<br>
                        <strong>🔍 Meta:</strong> ${escapeHtml(copyGenerado.meta_descripcion || 'N/A')}<br>
                        <strong>🏷️ Keywords:</strong> ${(copyGenerado.palabras_clave || []).join(', ') || 'N/A'}<br>
                        <strong>💰 Motor:</strong> ${data.motor || 'SALES'}
                    `;
                    document.getElementById('copyPreview').style.display = 'block';
                    mostrarToast(`✅ Copy generado por MOTOR ${data.motor || 'SALES'}`);
                } else {
                    mostrarToast('❌ Error generando copy: ' + (data.error || 'Error desconocido'), true);
                }
            } catch(e) {
                console.error('Error:', e);
                mostrarToast('❌ Error: ' + e.message, true);
            } finally {
                btn.textContent = originalText;
                btn.disabled = false;
            }
        }
        
        async function publicarProducto() {
            if (!copyGenerado) {
                mostrarToast('Primero genera el copy con SALES', true);
                return;
            }
            
            const url = document.getElementById('productoUrl').value.trim();
            const imagen = document.getElementById('productoImagen').value.trim();
            const categoria = document.getElementById('productoCategoria').value;
            const imageSize = document.getElementById('productoImageSize').value;
            const imagePosition = document.getElementById('productoImagePosition').value;
            
            try {
                const res = await fetch('/api/publicar-producto', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        url, 
                        imagenUrl: imagen, 
                        categoria,
                        imageSize, 
                        imagePosition, 
                        copy: copyGenerado
                    })
                });
                const data = await res.json();
                if (data.success) {
                    mostrarToast(`✅ Producto publicado con MOTOR ${data.motor || 'SALES'}`);
                    cerrarModal();
                    cargarStats();
                } else {
                    mostrarToast('❌ Error: ' + (data.error || 'Error desconocido'), true);
                }
            } catch(e) {
                console.error('Error:', e);
                mostrarToast('❌ Error publicando: ' + e.message, true);
            }
        }
        
        // Click fuera del modal para cerrar
        window.onclick = function(event) {
            const modal = document.getElementById('modalProducto');
            if (event.target === modal) {
                cerrarModal();
            }
        }
        
        // Inicializar y auto-refrescar cada 30 segundos
        cargarStats();
        setInterval(cargarStats, 30000);
    </script>
</body>
</html>
